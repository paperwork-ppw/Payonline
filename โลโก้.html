<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบปั๊มไลก์ & เพิ่มยอดโซเชียลอัตโนมัติ</title>
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้าฟอนต์ Prompt และ Inter เพื่อความสวยงามและอ่านง่าย -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- นำเข้า FontAwesome สำหรับไอคอนแพลตฟอร์มต่างๆ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Prompt', 'Inter', sans-serif;
            background-color: #18181b; /* พื้นหลังด้านบนสีเข้มเหมือนหน้าต่างโมดอลในแอป */
            -webkit-tap-highlight-color: transparent;
        }

        /* ซ่อน Scrollbar ของแถบเมนูแพลตฟอร์มแต่ยังเลื่อนได้ลื่นไหล */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-end sm:justify-center items-center sm:p-4">

    <!-- Container หลักจำลองหน้าต่างแอปพลิเคชันโค้งมนด้านบนเหมือนในภาพ -->
    <div class="w-full max-w-md bg-white min-h-[94vh] sm:min-h-0 sm:rounded-[32px] rounded-t-[32px] shadow-2xl flex flex-col justify-between overflow-hidden transition-all duration-300">
        
        <div class="p-6 pb-8">
            <!-- ส่วนหัว (Header): โลโก้ + ชื่อระบบ + ยอดเงินคงเหลือ -->
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-3">
                    <!-- โลโก้สีแดงโค้งมนสไตล์เดียวกับภาพตัวอย่าง -->
                    <div class="w-11 h-11 rounded-2xl bg-[#f42236] flex items-center justify-center text-white shadow-md shadow-red-500/20 shrink-0">
                        <i class="fa-solid fa-bolt text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-gray-900 leading-tight">สั่งซื้อบริการปั๊มยอด</h1>
                        <p class="text-xs text-gray-400">ระบบอัตโนมัติ 24 ชั่วโมง</p>
                    </div>
                </div>
                
                <!-- ปุ่มแสดงเครดิตคงเหลือ (สไตล์เดียวกับตัวเลือกภาษา "ไทย v" ในรูป) -->
                <button type="button" onclick="showToast('ยอดเงินคงเหลือของคุณคือ ฿1,250.00')" class="flex items-center gap-1.5 text-sm font-semibold text-gray-700 bg-gray-50 hover:bg-gray-100 px-3 py-2 rounded-xl transition">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span>฿1,250.00</span>
                    <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 ml-0.5"></i>
                </button>
            </div>

            <!-- แถบหัวเมนูแพลตฟอร์ม: สลับได้ และเลื่อนแนวนอนได้ (Segmented Control Style) -->
            <div class="bg-[#f3f4f6] p-1.5 rounded-2xl mb-5 relative">
                <div id="platformTabs" class="flex items-center gap-1 overflow-x-auto no-scrollbar scroll-smooth">
                    <!-- ปุ่มแท็บจะถูกสร้างด้วย JavaScript เพื่อให้จัดการสถานะ Active ได้แม่นยำ -->
                </div>
            </div>

            <!-- ฟอร์มสั่งซื้อบริการ -->
            <form id="orderForm" class="space-y-3.5" onsubmit="handleOrderSubmit(event)">
                
                <!-- 1. ช่องค้นหาไอดี หรือคีย์เวิร์ด -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i>
                    </div>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="ค้นหาด้วย ID บริการ หรือ คีย์เวิร์ด..." 
                        class="w-full bg-[#f3f4f6] text-gray-800 placeholder-gray-400 text-sm rounded-2xl pl-11 pr-10 py-3.5 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:bg-white border border-transparent focus:border-gray-200 transition"
                    >
                    <button type="button" id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </button>
                </div>

                <!-- 2. ช่องเลือกหมวดหมู่ (Custom Dropdown พร้อมไอคอน ไทย / ต่างประเทศ) -->
                <div class="relative" id="categoryDropdownWrapper">
                    <label class="block text-xs font-medium text-gray-500 mb-1.5 ml-1">เลือกหมวดหมู่บริการ</label>
                    <button type="button" id="categoryDropdownBtn" onclick="toggleDropdown('category')" class="w-full bg-[#f3f4f6] text-gray-800 text-sm font-medium rounded-2xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:bg-white border border-transparent focus:border-gray-200 transition flex items-center justify-between text-left">
                        <div id="categorySelectedDisplay" class="flex items-center gap-2.5 truncate">
                            <!-- แสดงหมวดหมู่ที่เลือกพร้อมไอคอน -->
                        </div>
                        <i class="fa-solid fa-chevron-down text-xs text-gray-400 shrink-0 ml-2 transition-transform duration-200" id="categoryArrow"></i>
                    </button>
                    <!-- รายการตัวเลือกหมวดหมู่ -->
                    <div id="categoryDropdownMenu" class="hidden absolute z-30 left-0 right-0 mt-1.5 bg-white rounded-2xl shadow-xl border border-gray-100 max-h-60 overflow-y-auto py-1.5">
                        <!-- รายการจะถูกสร้างด้วย JavaScript -->
                    </div>
                </div>

                <!-- 3. ช่องเลือกบริการ (Custom Dropdown พร้อมไอคอนโซเชียลของบริการนั้นๆ) -->
                <div class="relative" id="serviceDropdownWrapper">
                    <label class="block text-xs font-medium text-gray-500 mb-1.5 ml-1">เลือกบริการ</label>
                    <button type="button" id="serviceDropdownBtn" onclick="toggleDropdown('service')" class="w-full bg-[#f3f4f6] text-gray-800 text-sm font-medium rounded-2xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:bg-white border border-transparent focus:border-gray-200 transition flex items-center justify-between text-left">
                        <div id="serviceSelectedDisplay" class="flex items-center gap-2.5 truncate">
                            <!-- แสดงบริการที่เลือกพร้อมไอคอนโซเชียล -->
                        </div>
                        <i class="fa-solid fa-chevron-down text-xs text-gray-400 shrink-0 ml-2 transition-transform duration-200" id="serviceArrow"></i>
                    </button>
                    <!-- รายการตัวเลือกบริการ -->
                    <div id="serviceDropdownMenu" class="hidden absolute z-30 left-0 right-0 mt-1.5 bg-white rounded-2xl shadow-xl border border-gray-100 max-h-64 overflow-y-auto py-1.5">
                        <!-- รายการจะถูกสร้างด้วย JavaScript -->
                    </div>

                    <!-- กล่องรายละเอียดบริการย่อ (เรทราคา / ขั้นต่ำ-สูงสุด) -->
                    <div id="serviceMeta" class="mt-2 px-3 py-2 bg-gray-50 rounded-xl border border-gray-100 flex items-center justify-between text-[11px] text-gray-500">
                        <span id="serviceRateText">เรท: ฿0.00 / 1,000</span>
                        <span id="serviceMinMaxText">ขั้นต่ำ: 10 - สูงสุด: 10,000</span>
                    </div>
                </div>

                <!-- 4. ช่องวางลิงก์ของแพลตฟอร์ม + ข้อความระบุแพลตฟอร์มด้านล่าง -->
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1.5 ml-1">ลิงก์เป้าหมาย</label>
                    <div class="relative">
                        <input 
                            type="url" 
                            id="linkInput" 
                            required
                            placeholder="วางลิงก์ที่นี่..." 
                            class="w-full bg-[#f3f4f6] text-gray-800 placeholder-gray-400 text-sm rounded-2xl pl-4 pr-16 py-3.5 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:bg-white border border-transparent focus:border-gray-200 transition"
                        >
                        <!-- ปุ่มวางลิงก์ด่วน -->
                        <button type="button" onclick="pasteLink()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-white text-gray-600 hover:text-gray-900 text-xs font-medium px-2.5 py-1.5 rounded-xl shadow-sm border border-gray-100 transition">
                            วางลิงก์
                        </button>
                    </div>
                    <!-- ข้อความใต้ฟอร์มบอกว่าเป็นลิงก์ของแพลตฟอร์มไหน (เปลี่ยนอัตโนมัติตามแพลตฟอร์ม) -->
                    <div id="platformLinkHint" class="mt-1.5 ml-1 flex items-center gap-1.5 text-xs font-medium text-blue-600">
                        <i class="fa-solid fa-circle-info"></i>
                        <span>กรุณาวางลิงก์ของแพลตฟอร์ม: Facebook (ตัวอย่าง: https://www.facebook.com/...)</span>
                    </div>
                </div>

                <!-- 5. ระบุจำนวนที่ต้องการ และ 6. ค่าบริการที่ต้องชำระ (จัดวางคู่กันหรือเรียงสวยแบบฟอร์มในภาพ) -->
                <div class="grid grid-cols-2 gap-3 pt-1">
                    <!-- ระบุจำนวนที่ต้องการ -->
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1.5 ml-1">จำนวนที่ต้องการ</label>
                        <input 
                            type="number" 
                            id="quantityInput" 
                            required
                            min="10"
                            placeholder="ระบุจำนวน" 
                            class="w-full bg-[#f3f4f6] text-gray-900 font-semibold placeholder-gray-400 text-sm rounded-2xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:bg-white border border-transparent focus:border-gray-200 transition"
                        >
                    </div>

                    <!-- ค่าบริการที่ต้องชำระ -->
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1.5 ml-1">ค่าบริการที่ต้องชำระ</label>
                        <div class="w-full bg-[#f3f4f6] rounded-2xl px-4 py-3.5 flex items-center justify-between border border-transparent">
                            <span id="totalPriceDisplay" class="text-sm font-bold text-gray-900">฿0.00</span>
                            <span class="text-[11px] font-medium text-gray-400">THB</span>
                        </div>
                    </div>
                </div>

                <!-- ปุ่มยืนยันการสั่งซื้อสีดำเข้มเต็มความกว้าง เหมือนปุ่ม "สร้างบัญชี" ในรูปต้นแบบ -->
                <div class="pt-3">
                    <button type="submit" class="w-full bg-[#09090b] hover:bg-zinc-800 active:scale-[0.99] text-white font-semibold text-sm py-4 rounded-2xl shadow-lg shadow-black/15 transition-all flex items-center justify-center gap-2">
                        <span>ยืนยันการสั่งซื้อบริการ</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </div>

            </form>

            <!-- ส่วนล่างสุด: ทางลัดเติมเงิน / ประวัติการสั่งซื้อ (สไตล์เดียวกับ "หรือ สมัครผ่าน" + 4 ปุ่มด้านล่างในภาพ) -->
            <div class="mt-6">
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-100"></div>
                    <span class="flex-shrink mx-3 text-xs text-gray-400">เมนูลัดจัดการบัญชี</span>
                    <div class="flex-grow border-t border-gray-100"></div>
                </div>

                <div class="grid grid-cols-4 gap-2.5 mt-3">
                    <button type="button" onclick="showToast('เปิดหน้าต่างเติมเงินอัตโนมัติ (PromptPay / TrueMoney)', 'info')" class="flex flex-col items-center justify-center p-2.5 rounded-2xl border border-gray-100 bg-gray-50/60 hover:bg-gray-100 transition gap-1.5">
                        <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-sm">
                            <i class="fa-solid fa-wallet"></i>
                        </div>
                        <span class="text-[11px] font-medium text-gray-700">เติมเงิน</span>
                    </button>

                    <button type="button" onclick="showToast('กำลังโหลดรายการประวัติการสั่งซื้อของคุณ...', 'info')" class="flex flex-col items-center justify-center p-2.5 rounded-2xl border border-gray-100 bg-gray-50/60 hover:bg-gray-100 transition gap-1.5">
                        <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-sm">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                        </div>
                        <span class="text-[11px] font-medium text-gray-700">ประวัติสั่งซื้อ</span>
                    </button>

                    <button type="button" onclick="showToast('เชื่อมต่อ LINE Official เพื่อรับการแจ้งเตือนสถานะออเดอร์', 'info')" class="flex flex-col items-center justify-center p-2.5 rounded-2xl border border-gray-100 bg-gray-50/60 hover:bg-gray-100 transition gap-1.5">
                        <div class="w-8 h-8 rounded-full bg-[#06C755] text-white flex items-center justify-center text-sm">
                            <i class="fa-brands fa-line"></i>
                        </div>
                        <span class="text-[11px] font-medium text-gray-700">LINE แจ้งเตือน</span>
                    </button>

                    <button type="button" onclick="showToast('ติดต่อแอดมินดูแลตลอด 24 ชั่วโมง', 'info')" class="flex flex-col items-center justify-center p-2.5 rounded-2xl border border-gray-100 bg-gray-50/60 hover:bg-gray-100 transition gap-1.5">
                        <div class="w-8 h-8 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-sm">
                            <i class="fa-solid fa-headset"></i>
                        </div>
                        <span class="text-[11px] font-medium text-gray-700">ติดต่อแอดมิน</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal แจ้งเตือนแบบสวยงาม (แทนการใช้ alert) -->
    <div id="toastModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-xs p-4">
        <div class="bg-white rounded-3xl max-w-xs w-full p-6 text-center shadow-2xl transform transition-all">
            <div id="toastIcon" class="w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 id="toastTitle" class="text-base font-bold text-gray-900 mb-1">สำเร็จ</h3>
            <p id="toastMessage" class="text-xs text-gray-500 leading-relaxed mb-5">ข้อความแจ้งเตือน</p>
            <button type="button" onclick="closeToast()" class="w-full bg-gray-900 hover:bg-gray-800 text-white text-xs font-semibold py-3 rounded-xl transition">
                ตกลง
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. ข้อมูลแพลตฟอร์มและบริการทั้งหมด
        // ==========================================

        // ฟังก์ชันคืนค่า HTML ไอคอนธงชาติไทย / ต่างประเทศ สำหรับหมวดหมู่
        function getRegionBadgeHTML(region) {
            if (region === 'thai') {
                return `
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-red-50 text-red-600 border border-red-100 text-[11px] font-semibold shrink-0">
                        <svg class="w-3.5 h-2.5 rounded-[2px] shadow-2xs" viewBox="0 0 900 600"><rect width="900" height="600" fill="#ED1C24"/><rect y="100" width="900" height="400" fill="#fff"/><rect y="200" width="900" height="200" fill="#241D4F"/></svg>
                        <span>ไทย</span>
                    </span>
                `;
            }
            return `
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-blue-50 text-blue-600 border border-blue-100 text-[11px] font-semibold shrink-0">
                    <i class="fa-solid fa-earth-americas text-[11px]"></i>
                    <span>ต่างประเทศ</span>
                </span>
            `;
        }

        // ฟังก์ชันคืนค่า HTML ไอคอนโซเชียลมีเดียสำหรับรายการบริการ
        function getSocialIconHTML(socialType) {
            const map = {
                facebook: { icon: 'fa-brands fa-facebook', bg: 'bg-blue-100 text-blue-600' },
                tiktok: { icon: 'fa-brands fa-tiktok', bg: 'bg-zinc-900 text-white' },
                instagram: { icon: 'fa-brands fa-instagram', bg: 'bg-pink-100 text-pink-600' },
                youtube: { icon: 'fa-brands fa-youtube', bg: 'bg-red-100 text-red-600' },
                twitter: { icon: 'fa-brands fa-x-twitter', bg: 'bg-gray-200 text-gray-900' },
                shopee: { icon: 'fa-solid fa-bag-shopping', bg: 'bg-orange-100 text-orange-600' },
                twitch: { icon: 'fa-brands fa-twitch', bg: 'bg-purple-100 text-purple-600' },
                telegram: { icon: 'fa-brands fa-telegram', bg: 'bg-sky-100 text-sky-600' },
                threads: { icon: 'fa-brands fa-threads', bg: 'bg-gray-200 text-gray-900' }
            };
            const item = map[socialType] || { icon: 'fa-solid fa-globe', bg: 'bg-teal-100 text-teal-600' };
            return `<span class="w-6 h-6 rounded-lg ${item.bg} flex items-center justify-center shrink-0 text-xs"><i class="${item.icon}"></i></span>`;
        }

        // ==========================================
        // 2. ตัวแปรเก็บสถานะปัจจุบัน (State)
        // ==========================================
        let currentPlatformId = 'all';
        let currentCategory = '';
        let filteredServices = [...SERVICES_DATA];
        let selectedService = SERVICES_DATA[0];

        // อ้างอิง DOM Elements
        const platformTabsEl = document.getElementById('platformTabs');
        const searchInputEl = document.getElementById('searchInput');
        const clearSearchBtnEl = document.getElementById('clearSearchBtn');
        const categorySelectedDisplayEl = document.getElementById('categorySelectedDisplay');
        const categoryDropdownMenuEl = document.getElementById('categoryDropdownMenu');
        const serviceSelectedDisplayEl = document.getElementById('serviceSelectedDisplay');
        const serviceDropdownMenuEl = document.getElementById('serviceDropdownMenu');
        const linkInputEl = document.getElementById('linkInput');
        const platformLinkHintEl = document.getElementById('platformLinkHint');
        const quantityInputEl = document.getElementById('quantityInput');
        const totalPriceDisplayEl = document.getElementById('totalPriceDisplay');
        const serviceRateTextEl = document.getElementById('serviceRateText');
        const serviceMinMaxTextEl = document.getElementById('serviceMinMaxText');

        // จัดการเปิด-ปิด Custom Dropdown
        function toggleDropdown(type) {
            const catMenu = document.getElementById('categoryDropdownMenu');
            const srvMenu = document.getElementById('serviceDropdownMenu');
            const catArrow = document.getElementById('categoryArrow');
            const srvArrow = document.getElementById('serviceArrow');

            if (type === 'category') {
                const isHidden = catMenu.classList.contains('hidden');
                srvMenu.classList.add('hidden');
                srvArrow.classList.remove('rotate-180');
                if (isHidden) {
                    catMenu.classList.remove('hidden');
                    catArrow.classList.add('rotate-180');
                } else {
                    catMenu.classList.add('hidden');
                    catArrow.classList.remove('rotate-180');
                }
            } else {
                const isHidden = srvMenu.classList.contains('hidden');
                catMenu.classList.add('hidden');
                catArrow.classList.remove('rotate-180');
                if (isHidden) {
                    srvMenu.classList.remove('hidden');
                    srvArrow.classList.add('rotate-180');
                } else {
                    srvMenu.classList.add('hidden');
                    srvArrow.classList.remove('rotate-180');
                }
            }
        }

        // ปิด Dropdown อัตโนมัติเมื่อคลิกพื้นที่ด้านนอก
        document.addEventListener('click', (e) => {
            if (!document.getElementById('categoryDropdownWrapper').contains(e.target)) {
                document.getElementById('categoryDropdownMenu').classList.add('hidden');
                document.getElementById('categoryArrow').classList.remove('rotate-180');
            }
            if (!document.getElementById('serviceDropdownWrapper').contains(e.target)) {
                document.getElementById('serviceDropdownMenu').classList.add('hidden');
                document.getElementById('serviceArrow').classList.remove('rotate-180');
            }
        });

        // ==========================================
        // 3. สร้างปุ่มหัวเมนูแพลตฟอร์ม (สลับได้ + เลื่อนได้)
        // ==========================================
        function renderPlatformTabs() {
            platformTabsEl.innerHTML = '';
            PLATFORMS.forEach(plat => {
                const isActive = plat.id === currentPlatformId;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.dataset.id = plat.id;
                btn.className = `flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all shrink-0 ${
                    isActive 
                    ? 'bg-white text-gray-900 shadow-sm' 
                    : 'text-gray-500 hover:text-gray-800 hover:bg-white/50'
                }`;
                btn.innerHTML = `
                    <i class="${plat.icon} ${isActive ? plat.color : 'text-gray-400'}"></i>
                    <span>${plat.name}</span>
                `;
                btn.addEventListener('click', () => selectPlatform(plat.id, btn));
                platformTabsEl.appendChild(btn);
            });
        }

        // เมื่อผู้ใช้กดเลือกหัวเมนูแพลตฟอร์ม
        function selectPlatform(platformId, btnElement) {
            currentPlatformId = platformId;
            renderPlatformTabs();

            // เลื่อนปุ่มที่เลือกให้อยู่กึ่งกลางแถบเมนูอัตโนมัติ (Smooth Scroll)
            setTimeout(() => {
                const activeBtn = platformTabsEl.querySelector(`button[data-id="${platformId}"]`);
                if (activeBtn) {
                    activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }, 10);

            updateCategoriesAndServices();
        }

        // ==========================================
        // 4. ระบบกรองหมวดหมู่ บริการ และการค้นหา
        // ==========================================
        function updateCategoriesAndServices() {
            const keyword = searchInputEl.value.trim().toLowerCase();

            // กรองบริการตามแพลตฟอร์มที่เลือก และคำค้นหา (ID หรือ คีย์เวิร์ด)
            filteredServices = SERVICES_DATA.filter(item => {
                const matchPlatform = (currentPlatformId === 'all') || (item.platform === currentPlatformId);
                const matchKeyword = !keyword || 
                    item.name.toLowerCase().includes(keyword) || 
                    item.category.toLowerCase().includes(keyword) ||
                    item.id.toString().includes(keyword);
                return matchPlatform && matchKeyword;
            });

            // ดึงรายการหมวดหมู่ที่ไม่ซ้ำกันพร้อมประเภท (ไทย / ต่างประเทศ)
            const categoryMap = new Map();
            filteredServices.forEach(s => {
                if (!categoryMap.has(s.category)) {
                    categoryMap.set(s.category, s.region);
                }
            });

            categoryDropdownMenuEl.innerHTML = '';
            if (categoryMap.size === 0) {
                categorySelectedDisplayEl.innerHTML = `<span class="text-gray-400">ไม่พบหมวดหมู่ที่ตรงกับการค้นหา</span>`;
                serviceSelectedDisplayEl.innerHTML = `<span class="text-gray-400">ไม่พบบริการ</span>`;
                serviceDropdownMenuEl.innerHTML = '';
                updateServiceDetails(null);
                return;
            }

            categoryMap.forEach((region, catName) => {
                const itemBtn = document.createElement('button');
                itemBtn.type = 'button';
                itemBtn.className = 'w-full px-4 py-2.5 text-left text-sm hover:bg-gray-50 flex items-center gap-2.5 transition border-b border-gray-50 last:border-none';
                itemBtn.innerHTML = `
                    ${getRegionBadgeHTML(region)}
                    <span class="text-gray-800 font-medium truncate">${catName}</span>
                `;
                itemBtn.addEventListener('click', () => {
                    selectCategory(catName, region);
                    document.getElementById('categoryDropdownMenu').classList.add('hidden');
                    document.getElementById('categoryArrow').classList.remove('rotate-180');
                });
                categoryDropdownMenuEl.appendChild(itemBtn);
            });

            // เลือกหมวดหมู่แรกเป็นค่าเริ่มต้น
            const firstEntry = categoryMap.entries().next().value;
            selectCategory(firstEntry[0], firstEntry[1]);
        }

        function selectCategory(catName, region) {
            currentCategory = catName;
            categorySelectedDisplayEl.innerHTML = `
                ${getRegionBadgeHTML(region)}
                <span class="text-gray-800 font-medium truncate">${catName}</span>
            `;
            populateServicesByCategory(catName);
        }

        function populateServicesByCategory(selectedCategory) {
            const servicesInCat = filteredServices.filter(s => s.category === selectedCategory);
            serviceDropdownMenuEl.innerHTML = '';

            servicesInCat.forEach(srv => {
                const itemBtn = document.createElement('button');
                itemBtn.type = 'button';
                itemBtn.className = 'w-full px-4 py-2.5 text-left text-sm hover:bg-gray-50 flex items-center justify-between gap-2 transition border-b border-gray-50 last:border-none';
                itemBtn.innerHTML = `
                    <div class="flex items-center gap-2.5 min-w-0">
                        ${getSocialIconHTML(srv.socialType)}
                        <span class="text-gray-800 font-medium truncate">${srv.name}</span>
                    </div>
                    <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md shrink-0">฿${srv.rate.toFixed(2)}</span>
                `;
                itemBtn.addEventListener('click', () => {
                    updateServiceDetails(srv);
                    document.getElementById('serviceDropdownMenu').classList.add('hidden');
                    document.getElementById('serviceArrow').classList.remove('rotate-180');
                });
                serviceDropdownMenuEl.appendChild(itemBtn);
            });

            if (servicesInCat.length > 0) {
                updateServiceDetails(servicesInCat[0]);
            }
        }

        // ==========================================
        // 5. อัปเดตรายละเอียดบริการ ข้อความแจ้งแพลตฟอร์มใต้ช่องลิงก์ และคำนวณราคา
        // ==========================================
        function updateServiceDetails(service) {
            selectedService = service;

            if (!service) {
                serviceRateTextEl.textContent = 'เรท: ฿0.00 / 1,000';
                serviceMinMaxTextEl.textContent = 'ขั้นต่ำ: 0 - สูงสุด: 0';
                platformLinkHintEl.innerHTML = `<i class="fa-solid fa-circle-exclamation text-amber-500"></i><span class="text-amber-600">กรุณาเลือกบริการก่อนวางลิงก์</span>`;
                calculateTotal();
                return;
            }

            // อัปเดตการแสดงผลบริการที่เลือกพร้อมไอคอนโซเชียลในช่องหลัก
            serviceSelectedDisplayEl.innerHTML = `
                ${getSocialIconHTML(service.socialType)}
                <span class="text-gray-800 font-medium truncate">${service.name}</span>
            `;

            // อัปเดตเรทและขั้นต่ำ-สูงสุด
            serviceRateTextEl.textContent = `เรทราคา: ฿${service.rate.toFixed(2)} / 1,000`;
            serviceMinMaxTextEl.textContent = `ขั้นต่ำ: ${service.min.toLocaleString()} - สูงสุด: ${service.max.toLocaleString()}`;

            // ตั้งค่า min/max และ placeholder ของช่องจำนวน
            quantityInputEl.min = service.min;
            quantityInputEl.max = service.max;
            quantityInputEl.placeholder = `ขั้นต่ำ ${service.min.toLocaleString()}`;

            // อัปเดต Placeholder และข้อความใต้ช่องลิงก์ให้ตรงกับแพลตฟอร์มนั้นๆ เป๊ะๆ
            linkInputEl.placeholder = `วางลิงก์ ${service.platformLabel} ที่นี่...`;
            platformLinkHintEl.innerHTML = `
                <i class="fa-solid fa-link text-blue-600 shrink-0"></i>
                <span>ต้องเป็นลิงก์ของแพลตฟอร์ม: <strong class="underline">${service.platformLabel}</strong> (เช่น ${service.linkExample})</span>
            `;

            calculateTotal();
        }

        // คำนวณค่าบริการที่ต้องชำระแบบ Real-time
        function calculateTotal() {
            if (!selectedService) {
                totalPriceDisplayEl.textContent = '฿0.00';
                return;
            }
            const qty = parseFloat(quantityInputEl.value) || 0;
            const total = (qty / 1000) * selectedService.rate;
            totalPriceDisplayEl.textContent = `฿${total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        // ==========================================
        // 6. Event Listeners และการโต้ตอบต่างๆ
        // ==========================================
        quantityInputEl.addEventListener('input', calculateTotal);

        searchInputEl.addEventListener('input', () => {
            if (searchInputEl.value.length > 0) {
                clearSearchBtnEl.classList.remove('hidden');
            } else {
                clearSearchBtnEl.classList.add('hidden');
            }
            updateCategoriesAndServices();
        });

        function clearSearch() {
            searchInputEl.value = '';
            clearSearchBtnEl.classList.add('hidden');
            updateCategoriesAndServices();
        }

        // ฟังก์ชันวางลิงก์จาก Clipboard (พร้อม Fallback)
        async function pasteLink() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    linkInputEl.value = text;
                    linkInputEl.focus();
                }
            } catch (err) {
                linkInputEl.focus();
                showToast('กรุณากดค้างในช่องกรอกลิงก์แล้วเลือก "วาง" (Paste)', 'info');
            }
        }

        // จัดการเมื่อกดยืนยันสั่งซื้อ
        function handleOrderSubmit(e) {
            e.preventDefault();
            if (!selectedService) {
                showToast('กรุณาเลือกบริการที่ต้องการสั่งซื้อ', 'error');
                return;
            }

            const qty = parseInt(quantityInputEl.value) || 0;
            if (qty < selectedService.min || qty > selectedService.max) {
                showToast(`กรุณาระบุจำนวนระหว่าง ${selectedService.min.toLocaleString()} ถึง ${selectedService.max.toLocaleString()}`, 'error');
                return;
            }

            const total = ((qty / 1000) * selectedService.rate).toFixed(2);
            showToast(
                `สั่งซื้อ "${selectedService.name}" จำนวน ${qty.toLocaleString()} เรียบร้อยแล้ว ยอดชำระ ฿${total}`,
                'success',
                'ส่งคำสั่งซื้อสำเร็จ!'
            );
        }

        // ระบบ Modal แจ้งเตือนแทน alert()
        function showToast(message, type = 'success', title = 'แจ้งเตือนระบบ') {
            const modal = document.getElementById('toastModal');
            const iconEl = document.getElementById('toastIcon');
            const titleEl = document.getElementById('toastTitle');
            const msgEl = document.getElementById('toastMessage');

            titleEl.textContent = title;
            msgEl.textContent = message;

            if (type === 'error') {
                iconEl.className = 'w-14 h-14 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4 text-2xl';
                iconEl.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            } else if (type === 'info') {
                iconEl.className = 'w-14 h-14 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mx-auto mb-4 text-2xl';
                iconEl.innerHTML = '<i class="fa-solid fa-info"></i>';
            } else {
                iconEl.className = 'w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4 text-2xl';
                iconEl.innerHTML = '<i class="fa-solid fa-check"></i>';
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeToast() {
            const modal = document.getElementById('toastModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // เริ่มต้นทำงานเมื่อโหลดหน้าเว็บ
        window.addEventListener('DOMContentLoaded', () => {
            renderPlatformTabs();
            updateCategoriesAndServices();
        });
    </script>
</body>
</html>
