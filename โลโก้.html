
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yahaterm Loading</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fff;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Kanit', sans-serif;
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    min-height: 200px;
}

/* พื้นที่โลโก้ */

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    position: relative;
    font-size: clamp(38px, 10vw, 76px);
    font-weight: 800;
    letter-spacing: -3px;
}

/* ตัวอักษร */

.letter {
    display: inline-block;
    color: #303e60;
    opacity: 0;
    will-change: transform, opacity;
}

/* สีตัวอักษร */

.letter:nth-child(1),
.letter:nth-child(2) {
    color: #00bfa5;
}

.letter:nth-child(3),
.letter:nth-child(4) {
    color: #303e60;
}

.letter:nth-child(5),
.letter:nth-child(6) {
    color: #303e60;
}

.letter:nth-child(7),
.letter:nth-child(8) {
    color: #078de0;
}

/* แสงหลังโลโก้ */

.glow {
    position: absolute;
    width: 180px;
    height: 100px;
    background: linear-gradient(
        90deg,
        rgba(0,220,170,.12),
        rgba(0,140,255,.12)
    );
    filter: blur(45px);
    border-radius: 50%;
    opacity: 0;
    transition: opacity 1s;
    pointer-events: none;
}

.glow.show {
    opacity: 1;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo" id="logo">
        <div class="glow" id="glow"></div>

        <span class="letter">Y</span>
        <span class="letter">a</span>
        <span class="letter">h</span>
        <span class="letter">a</span>
        <span class="letter">t</span>
        <span class="letter">e</span>
        <span class="letter">r</span>
        <span class="letter">m</span>
    </div>

</div>

<script>

const letters = document.querySelectorAll('.letter');
const logo = document.getElementById('logo');
const glow = document.getElementById('glow');

function animateLogo() {

    const rect = logo.getBoundingClientRect();

    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    const radius = 85;
    const total = letters.length;

    letters.forEach((letter, index) => {

        const box = letter.getBoundingClientRect();

        const targetX = box.left - rect.left + box.width / 2 - centerX;
        const targetY = box.top - rect.top + box.height / 2 - centerY;

        const startAngle = (index / total) * Math.PI * 2;

        const keyframes = [];

        // จุดเริ่มต้นบนวงกลม
        for (let step = 0; step <= 24; step++) {

            const progress = step / 24;

            const angle = startAngle + progress * Math.PI * 4;

            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;

            const moveX = x - targetX;
            const moveY = y - targetY;

            keyframes.push({
                offset: progress * 0.75,
                transform: `
                    translate(${moveX}px, ${moveY}px)
                    rotate(${progress * 720}deg)
                    scale(${0.7 + progress * 0.3})
                `,
                opacity: 1
            });
        }

        // พุ่งเข้าประกอบเป็นชื่อ
        keyframes.push({
            offset: 1,
            transform: 'translate(0,0) rotate(0deg) scale(1)',
            opacity: 1
        });

        letter.animate(keyframes, {
            duration: 2800,
            delay: index * 80,
            easing: 'cubic-bezier(.16,1,.3,1)',
            fill: 'forwards'
        });

    });

    setTimeout(() => {
        glow.classList.add('show');
    }, 2300);

}

// เริ่มแอนิเมชั่น
window.addEventListener('load', () => {
    setTimeout(animateLogo, 300);
});

// เล่นใหม่เมื่อรีเฟรช
</script>

</body>
</html>
