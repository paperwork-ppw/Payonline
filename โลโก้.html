<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yahaterm Loading</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Kanit', sans-serif;
}

.container {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* วงแอนิเมชั่น */

.animation {
    position: absolute;
    width: 145px;
    height: 145px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* วงไข่ปลา */

.dots {
    position: absolute;
    width: 115px;
    height: 115px;
    border-radius: 50%;

    background: repeating-conic-gradient(
        #00cba5 0deg 5deg,
        transparent 5deg 15deg,
        #078de0 15deg 20deg,
        transparent 20deg 30deg
    );

    -webkit-mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 4px),
        #000 calc(100% - 3px)
    );

    mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 4px),
        #000 calc(100% - 3px)
    );

    opacity: 0;
}

/* วงเส้นตรง */

.line {
    position: absolute;
    width: 135px;
    height: 135px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #00cba5;
    border-right-color: #078de0;
    opacity: 0;
}

/* เริ่มหมุน */

.animation.start .dots {
    animation:
        spin 1s linear 2,
        alternateDots 2s steps(1) 2;
}

.animation.start .line {
    animation:
        spinReverse 1s linear 2,
        alternateLine 2s steps(1) 2;
}

/* หมุน 2 รอบ */

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(720deg); }
}

@keyframes spinReverse {
    from { transform: rotate(0deg); }
    to { transform: rotate(-720deg); }
}

/* สลับไข่ปลาและเส้น */

@keyframes alternateDots {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
}

@keyframes alternateLine {
    0%, 49% { opacity: 0; }
    50%, 100% { opacity: 1; }
}

/* ชื่อ Yahaterm */

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;

    font-size: clamp(40px, 10vw, 72px);
    font-weight: 800;
    letter-spacing: -3px;
}

.letter {
    display: inline-block;
    opacity: 0;
    transform: scale(0.3) translateY(15px);
    transform-origin: center;
}

/* สีตัวอักษร */

.letter:nth-child(1),
.letter:nth-child(2) {
    color: #00bfa5;
}

.letter:nth-child(3),
.letter:nth-child(4),
.letter:nth-child(5) {
    color: #303e60;
}

.letter:nth-child(6),
.letter:nth-child(7),
.letter:nth-child(8) {
    color: #078de0;
}

/* เด้งทีละตัว */

.letter.show {
    animation: pop 0.55s cubic-bezier(.17,.89,.32,1.49) forwards;
}

@keyframes pop {
    0% {
        opacity: 0;
        transform: scale(.3) translateY(15px);
    }

    65% {
        opacity: 1;
        transform: scale(1.18) translateY(-4px);
    }

    100% {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

/* Responsive */

@media(max-width:480px) {
    .logo {
        font-size: 42px;
        letter-spacing: -2px;
    }

    .animation {
        transform: scale(.9);
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- วงกลมแอนิเมชั่น -->
    <div class="animation" id="animation">
        <div class="dots"></div>
        <div class="line"></div>
    </div>

    <!-- โลโก้ตัวอักษร -->
    <div class="logo" id="logo">
        <span class="letter">Y</span>
        <span class="letter">a</span>
        <span class="letter">h</span>
        <span class="letter">a</span>
        <span class="letter">t</span>
        <span class="letter">e</span>
        <span class="letter">r</span>
        <span class="letter">m</span>
    </div>

</div>

<script>

const animation = document.getElementById('animation');
const letters = document.querySelectorAll('.letter');

// เริ่มวงกลม
window.addEventListener('load', () => {

    setTimeout(() => {
        animation.classList.add('start');
    }, 300);

    // หมุนครบ 2 รอบแล้วแสดงชื่อ
    setTimeout(() => {

        animation.style.transition = 'opacity .35s ease';
        animation.style.opacity = '0';

        setTimeout(() => {

            animation.style.display = 'none';

            // เด้งตัวอักษรทีละตัว
            letters.forEach((letter, index) => {

                setTimeout(() => {
                    letter.classList.add('show');
                }, index * 100);

            });

        }, 350);

    }, 2400);

});

</script>

</body>
</html>
