<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YHT - YAHATERM SHOP</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลดฟอนต์ภาษาไทย Prompt และ Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- โหลด Lucide Icons และ FontAwesome สำหรับไอคอนแพลตฟอร์มโซเชียล -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Prompt', 'Inter', sans-serif;
            background-color: #f4f4f5;
            color: #18181b;
            -webkit-tap-highlight-color: transparent;
        }

        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* สไตล์ Scrollbar สำหรับเมนูด้านข้าง */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #d4d4d8;
            border-radius: 9999px;
        }

        /* แอนิเมชันการเปลี่ยนหน้า */
        .fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#f4f4f5] relative overflow-x-hidden">

    <!-- ==================== 1. ส่วนหัว (HEADER) ==================== -->
    <header class="bg-[#f4f4f5] border-b border-zinc-200/80 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 pt-3.5 pb-2.5 flex items-center justify-between gap-3">
            
            <!-- โลโก้ YHT YAHATERM SHOP (ฝั่งซ้าย) -->
            <div onclick="navigateTo('home')" class="flex flex-col select-none cursor-pointer shrink-0">
                <div class="flex items-center tracking-tighter font-extrabold text-2xl leading-none">
                    <span class="text-[#27272a]">YH</span><span class="text-[#d91b24]">T</span>
                </div>
                <span class="text-[9px] font-bold tracking-[0.18em] text-[#52525b] mt-0.5">YAHATERM SHOP</span>
            </div>

            <!-- แถบเมนูหลักสำหรับ PC -->
            <nav class="hidden lg:flex items-center gap-1 flex-1 justify-center">
                <button onclick="openSideDrawer()" class="px-3.5 py-2 rounded-xl text-sm font-semibold text-zinc-700 hover:bg-zinc-200/70 flex items-center gap-1.5 transition-colors">
                    <i data-lucide="menu" class="w-4 h-4 text-[#d91b24]"></i> เมนูบริการทั้งหมด
                </button>
                <button onclick="navigateTo('home')" data-pc-nav="home" class="pc-nav-btn px-3.5 py-2 rounded-xl text-sm font-medium text-zinc-600 hover:bg-zinc-200/70 transition-colors">
                    หน้าหลัก
                </button>
                <button onclick="switchBottomTab('shop')" data-pc-nav="shop" class="pc-nav-btn px-3.5 py-2 rounded-xl text-sm font-medium text-zinc-600 hover:bg-zinc-200/70 transition-colors">
                    ร้านค้า
                </button>
                <button onclick="switchBottomTab('transaction')" data-pc-nav="transaction" class="pc-nav-btn px-3.5 py-2 rounded-xl text-sm font-medium text-zinc-600 hover:bg-zinc-200/70 transition-colors">
                    ธุรกรรม
                </button>
                <button onclick="switchBottomTab('history')" data-pc-nav="history" class="pc-nav-btn px-3.5 py-2 rounded-xl text-sm font-medium text-zinc-600 hover:bg-zinc-200/70 transition-colors">
                    ประวัติ
                </button>
                <button onclick="switchBottomTab('promotion')" data-pc-nav="promotion" class="pc-nav-btn px-3.5 py-2 rounded-xl text-sm font-medium text-zinc-600 hover:bg-zinc-200/70 transition-colors">
                    โปรโมชั่น
                </button>
            </nav>

            <!-- กลุ่มด้านขวา: กล่องยอดเงิน (ปุ่มไอคอนรีเฟรช) -> รถเข็นอยู่หลังยอดเงิน -> กระดิ่งแจ้งเตือน -->
            <div class="flex items-center gap-2 shrink-0">
                <!-- กล่องยอดเงิน พร้อมปุ่มไอคอนรีเฟรช -->
                <div class="bg-white px-2.5 py-1.5 rounded-xl shadow-2xs border border-zinc-200/80 flex items-center gap-2">
                    <button type="button" onclick="refreshBalance(event)" title="รีเฟรชยอดเงิน" class="w-6 h-6 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-[#16a34a] flex items-center justify-center active:scale-90 transition-all">
                        <i id="refreshBalanceIcon" data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                    </button>
                    <button id="balanceBtn" onclick="toggleBalanceDropdown()" class="flex items-center gap-1.5 active:scale-95 transition-transform">
                        <span id="balanceAmount" class="font-bold text-sm text-zinc-900">฿500.00</span>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-zinc-500"></i>
                    </button>
                </div>

                <!-- ปุ่มตะกร้าสินค้า (อยู่หลังยอดเงินตามที่กำหนด) -->
                <button onclick="navigateTo('cart', 'ตะกร้ารถเข็น')" class="p-2 rounded-xl bg-white border border-zinc-200/80 hover:bg-zinc-50 active:scale-95 transition-all relative text-zinc-800">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                    <span id="cartBadge" class="hidden absolute -top-1.5 -right-1.5 bg-[#d91b24] text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full border border-white">0</span>
                </button>

                <!-- ปุ่มกระดิ่งแจ้งเตือน -->
                <button onclick="navigateTo('notifications', 'ศูนย์การแจ้งเตือน')" class="p-2 rounded-full hover:bg-zinc-200/70 active:scale-90 transition-all relative text-zinc-900">
                    <i data-lucide="bell" class="w-6 h-6 fill-zinc-900"></i>
                    <span class="absolute top-1 right-1 bg-[#d91b24] text-white text-[9px] font-bold px-1 rounded-full leading-tight border border-white">22</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Dropdown ยอดเงิน -->
    <div id="balanceDropdown" class="hidden fixed top-16 right-4 w-64 bg-white rounded-2xl shadow-xl border border-zinc-200 p-3.5 z-40 fade-in">
        <div class="text-xs text-zinc-500 mb-0.5">ยอดเงินคงเหลือในกระเป๋า</div>
        <div id="dropdownBalanceText" class="text-xl font-bold text-zinc-900 mb-3">฿500.00 <span class="text-xs font-normal text-zinc-400">THB</span></div>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="document.getElementById('balanceDropdown').classList.add('hidden'); switchBottomTab('transaction');" class="py-2 bg-[#00a65a] hover:bg-[#008d4c] text-white text-xs font-semibold rounded-xl transition-colors flex items-center justify-center gap-1">
                <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> ฝากเงิน
            </button>
            <button onclick="document.getElementById('balanceDropdown').classList.add('hidden'); navigateTo('withdraw', 'ถอนเงิน');" class="py-2 bg-white border border-[#d91b24] text-[#d91b24] hover:bg-red-50 text-xs font-semibold rounded-xl transition-colors flex items-center justify-center gap-1">
                <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i> ถอนเงิน
            </button>
        </div>
    </div>

    <!-- ==================== 2. ช่องค้นหา และ ปุ่มตั้งค่า (แสดงเฉพาะหน้าร้านค้า) ==================== -->
    <section id="searchSection" class="hidden max-w-7xl w-full mx-auto px-4 pt-3 pb-1 flex items-center gap-2.5">
        <div class="flex-1 bg-[#e4e4e7] rounded-2xl px-3.5 py-2.5 flex items-center gap-2.5 focus-within:ring-2 focus-within:ring-zinc-400/50 transition-all">
            <i data-lucide="search" class="w-5 h-5 text-zinc-500 shrink-0"></i>
            <input 
                type="text" 
                id="searchInput"
                oninput="handleSearch(this.value)"
                placeholder="ค้นหาชื่อเกมส์ สินค้าออนไลน์ แอพพรีเมี่ยม..." 
                class="bg-transparent w-full text-sm text-zinc-800 placeholder-zinc-500 focus:outline-none"
            >
            <button id="clearSearchBtn" onclick="clearSearch()" class="hidden text-zinc-400 hover:text-zinc-600">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- ปุ่มตั้งค่า -->
        <button onclick="openSettingsModal()" aria-label="ตั้งค่า" class="bg-[#e4e4e7] hover:bg-zinc-300/80 active:scale-95 transition-all p-2.5 rounded-2xl text-zinc-700 shrink-0">
            <i data-lucide="settings" class="w-5 h-5"></i>
        </button>
    </section>

    <!-- แถบหมวดหมู่ย่อย (แสดงเฉพาะตอนอยู่หน้าร้านค้า) -->
    <nav id="shopCategoryBar" class="hidden max-w-7xl w-full mx-auto mt-1 border-b border-zinc-200 bg-[#f4f4f5] sticky top-[57px] z-20">
        <div id="categoryTabs" class="flex items-center overflow-x-auto no-scrollbar px-2">
            <!-- แท็บหมวดหมู่สินค้า -->
        </div>
    </nav>

    <!-- ==================== 3. พื้นที่แสดงเนื้อหาหลัก ==================== -->
    <main id="mainContent" class="max-w-7xl w-full mx-auto flex-1 p-4 pb-24 lg:pb-10">
        <!-- เนื้อหาแต่ละหน้าจะถูกแสดงที่นี่ -->
    </main>

    <!-- ==================== 4. แถบเมนูด้านล่าง (Bottom Navigation Bar) สำหรับมือถือ ==================== -->
    <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-[#f4f4f5]/95 backdrop-blur-md border-t border-zinc-200 z-30 shadow-[0_-2px_10px_rgba(0,0,0,0.03)]">
        <div class="grid grid-cols-5 h-16 max-w-md mx-auto">
            <!-- 1. บริการ -->
            <button onclick="openSideDrawer()" id="bnav-service" class="bottom-nav-item flex flex-col items-center justify-center gap-1 text-zinc-500 hover:text-zinc-900 relative transition-colors">
                <i data-lucide="align-left" class="w-5 h-5"></i>
                <span class="text-[11px] font-medium">บริการ</span>
            </button>

            <!-- 2. ร้านค้า -->
            <button onclick="switchBottomTab('shop')" id="bnav-shop" class="bottom-nav-item flex flex-col items-center justify-center gap-1 text-zinc-500 hover:text-zinc-900 relative transition-colors">
                <i data-lucide="store" class="w-5 h-5"></i>
                <span class="text-[11px] font-medium">ร้านค้า</span>
            </button>

            <!-- 3. ธุรกรรม -->
            <button onclick="switchBottomTab('transaction')" id="bnav-transaction" class="bottom-nav-item flex flex-col items-center justify-center gap-1 text-zinc-500 hover:text-zinc-900 relative transition-colors">
                <i data-lucide="arrow-up-down" class="w-5 h-5"></i>
                <span class="text-[11px] font-medium">ธุรกรรม</span>
            </button>

            <!-- 4. ประวัติ -->
            <button onclick="switchBottomTab('history')" id="bnav-history" class="bottom-nav-item flex flex-col items-center justify-center gap-1 text-zinc-500 hover:text-zinc-900 relative transition-colors">
                <i data-lucide="file-text" class="w-5 h-5"></i>
                <span class="text-[11px] font-medium">ประวัติ</span>
            </button>

            <!-- 5. โปรโมชั่น -->
            <button onclick="switchBottomTab('promotion')" id="bnav-promotion" class="bottom-nav-item flex flex-col items-center justify-center gap-1 text-zinc-500 hover:text-zinc-900 relative transition-colors">
                <i data-lucide="gift" class="w-5 h-5"></i>
                <span class="text-[11px] font-medium">โปรโมชั่น</span>
            </button>
        </div>
    </nav>

    <!-- ==================== 5. เมนูด้านข้าง (SIDE DRAWER) ==================== -->
    <div id="drawerBackdrop" onclick="closeSideDrawer()" class="hidden fixed inset-0 bg-black/50 backdrop-blur-[1px] z-50 transition-opacity opacity-0"></div>

    <aside id="sideDrawer" class="fixed top-0 left-0 bottom-0 w-[85%] max-w-[340px] bg-[#f4f4f5] z-50 shadow-2xl transform -translate-x-full transition-transform duration-300 ease-out flex flex-col">
        
        <!-- ส่วนหัวข้อมูลผู้ใช้ในเมนูด้านข้าง -->
        <div class="p-4 bg-[#f4f4f5] border-b border-zinc-200/80 flex items-start justify-between gap-2 shrink-0">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-12 h-12 rounded-xl bg-zinc-950 flex flex-col items-center justify-center shrink-0 shadow-sm">
                    <span class="text-white font-extrabold text-sm leading-none tracking-tighter">YH<span class="text-[#d91b24]">T</span></span>
                    <i data-lucide="trending-up" class="w-4 h-4 text-[#d91b24] mt-0.5"></i>
                </div>
                <div class="min-w-0">
                    <div class="font-bold text-sm text-zinc-900 truncate">สวัสดี สมาชิก YAHATERM</div>
                    <div class="text-xs text-zinc-500 truncate">y*****@gmail.com</div>
                    <div class="flex items-center gap-1.5 text-xs text-zinc-600 mt-0.5">
                        <span>รหัสกระเป๋าเงิน: <strong class="font-semibold text-zinc-800">70812196</strong></span>
                        <button onclick="copyText('70812196')" class="text-zinc-500 hover:text-zinc-900 p-0.5" title="คัดลอกรหัสกระเป๋าเงิน">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>
            </div>
            <button onclick="closeSideDrawer()" class="p-1.5 rounded-lg text-zinc-400 hover:text-zinc-700 hover:bg-zinc-200/60">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- รายการเมนูทั้งหมด -->
        <div id="drawerMenuList" class="flex-1 overflow-y-auto custom-scrollbar divide-y divide-zinc-200/80 px-2">
        </div>

        <!-- ส่วนปุ่มด้านล่างสุดของเมนูข้าง: ฝากเงิน / ถอนเงิน -->
        <div class="p-3 bg-[#f4f4f5] border-t border-zinc-200 grid grid-cols-2 gap-2.5 shrink-0">
            <button onclick="closeSideDrawer(); switchBottomTab('transaction');" class="py-2.5 px-3 bg-[#00a65a] hover:bg-[#008d4c] active:scale-95 transition-all text-white font-semibold text-sm rounded-lg shadow-xs text-center">
                ฝากเงิน
            </button>
            <button onclick="closeSideDrawer(); navigateTo('withdraw', 'ถอนเงิน');" class="py-2.5 px-3 bg-white border border-[#d91b24] text-[#d91b24] hover:bg-red-50 active:scale-95 transition-all font-semibold text-sm rounded-lg text-center">
                ถอนเงิน
            </button>
        </div>
    </aside>

    <!-- ==================== 6. Modal รายละเอียดสินค้า / เติมเกมส์ / แอพพรีเมี่ยม ==================== -->
    <div id="productDetailModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-y-auto">
        <div id="productDetailContent" class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl fade-in max-h-[92vh] overflow-y-auto custom-scrollbar">
            <!-- เนื้อหารายละเอียดจะถูกใส่ด้วย JS -->
        </div>
    </div>

    <!-- Modal คู่มือปั๊มไลก์ -->
    <div id="guideModal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/60 backdrop-blur-xs p-0 sm:p-4">
        <div class="bg-white rounded-t-[32px] sm:rounded-3xl max-w-md w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden fade-in">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50/50">
                <div class="flex items-center gap-2.5">
                    <div id="guideModalIcon" class="w-9 h-9 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-base">
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                    <h3 id="guideModalTitle" class="text-base font-bold text-gray-900">หัวข้อคู่มือ</h3>
                </div>
                <button type="button" onclick="closeGuideModal()" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            <div id="guideModalBody" class="p-6 overflow-y-auto text-sm text-gray-600 space-y-4 leading-relaxed"></div>
            <div class="p-4 border-t border-gray-100 bg-white">
                <button type="button" onclick="closeGuideModal()" class="w-full bg-gray-900 hover:bg-gray-800 text-white text-xs font-semibold py-3.5 rounded-2xl transition">
                    เข้าใจแล้ว / ปิดหน้าต่าง
                </button>
            </div>
        </div>
    </div>

    <!-- Modal ตั้งค่า -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl fade-in">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-base text-zinc-900 flex items-center gap-2">
                    <i data-lucide="sliders-horizontal" class="w-5 h-5 text-[#d91b24]"></i> ตั้งค่าระบบ YHT
                </h3>
                <button onclick="closeSettingsModal()" class="p-1.5 rounded-full bg-zinc-100 text-zinc-500 hover:text-zinc-800">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div class="space-y-3 text-sm">
                <div class="flex items-center justify-between p-3 bg-zinc-50 rounded-2xl">
                    <span>แจ้งเตือนสถานะคำสั่งซื้ออัตโนมัติ</span>
                    <input type="checkbox" checked class="w-4 h-4 accent-[#d91b24] rounded">
                </div>
                <div class="flex items-center justify-between p-3 bg-zinc-50 rounded-2xl">
                    <span>แสดงโปรโมชั่นแนะนำในหน้าหลัก</span>
                    <input type="checkbox" checked class="w-4 h-4 accent-[#d91b24] rounded">
                </div>
            </div>
            <button onclick="closeSettingsModal(); showToast('บันทึกการตั้งค่าเรียบร้อย')" class="w-full mt-5 py-2.5 bg-zinc-900 text-white font-medium text-sm rounded-xl active:scale-95 transition-transform">
                ตกลง
            </button>
        </div>
    </div>

    <!-- กล่องข้อความแจ้งเตือน Toast -->
    <div id="toast" class="fixed bottom-20 lg:bottom-6 left-1/2 -translate-x-1/2 bg-zinc-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 whitespace-nowrap">
        ข้อความแจ้งเตือน
    </div>

    <script>
        // ==================== ข้อมูลโครงสร้างเมนูด้านข้างทั้งหมด ====================
        const SIDEBAR_MENUS = [
            { id: 'home', label: 'หน้าหลัก', icon: 'home' },
            { id: 'profile', label: 'โปรไฟล์ของฉัน', icon: 'user-circle' },
            {
                id: 'online-store',
                label: 'ร้านค้าออนไลน์',
                icon: 'shopping-bag',
                children: [
                    { id: 'cart', label: 'ตะกร้ารถเข็น' },
                    { id: 'order-status', label: 'สถานะคำสั่งซื้อ' },
                    { id: 'shipping-status', label: 'สถานะการจัดส่ง' }
                ]
            },
            { id: 'online-products', label: 'สินค้าออนไลน์', icon: 'package', isCategory: true },
            { id: 'games', label: 'เติมเกมส์', icon: 'gamepad-2', isCategory: true },
            { id: 'premium', label: 'แอพพรีเมี่ยม', icon: 'crown', isCategory: true },
            { id: 'packages', label: 'แพ็กเกจเสริม', icon: 'wifi', isCategory: true },
            { id: 'topup', label: 'บัตรเติมเงิน', icon: 'credit-card', isCategory: true },
            { id: 'followers', label: 'เพิ่มยอดฟอล / ปั๊มไลก์', icon: 'users', isCategory: true },
            { id: 'lucky-draw', label: 'สุ่มรางวัล', icon: 'sparkles', badge: 'ฮิต' },
            { id: 'claim', label: 'เคลมสินค้า', icon: 'shield-check' },
            { id: 'report-issue', label: 'แจ้งปัญหาการใช้งาน', icon: 'alert-circle' },
            { id: 'movies', label: 'ดูหนังซีรีย์', icon: 'film', badge: 'ฟรี' },
            {
                id: 'business',
                label: 'สำหรับธุรกิจ',
                icon: 'briefcase',
                children: [
                    { id: 'agent-register', label: 'สมัครตัวแทน' },

        // ==================== เริ่มต้นทำงาน ====================

        function updateBalanceDisplay() {
            const formatted = `฿${currentBalance.toFixed(2)}`;
            document.getElementById('balanceAmount').textContent = formatted;
            document.getElementById('dropdownBalanceText').innerHTML = `${formatted} <span class="text-xs font-normal text-zinc-400">THB</span>`;
            
            const badge = document.getElementById('cartBadge');
            if (cartItems.length > 0) {
                badge.textContent = cartItems.reduce((sum, i) => sum + i.qty, 0);
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function refreshBalance(event) {
            if (event) event.stopPropagation();
            const icon = document.getElementById('refreshBalanceIcon');
            if (icon) {
                icon.classList.add('animate-spin');
                setTimeout(() => {
                    icon.classList.remove('animate-spin');
                    updateBalanceDisplay();
                    showToast(`อัปเดตยอดเงินล่าสุดแล้ว: ฿${currentBalance.toFixed(2)}`);
                }, 500);
            }
        }

        function toggleSubmenu(menuId) {
            openSubmenus[menuId] = !openSubmenus[menuId];

            lucide.createIcons();

        function handleDrawerItemClick(id, label, isCategory) {
            closeSideDrawer();
            if (isCategory) {
                activeShopCategory = id;
                renderShopTabs();
                switchBottomTab('shop');
            } else {
                navigateTo(id, label);
            }
        }

        function openSideDrawer() {
            const drawer = document.getElementById('sideDrawer');
            const backdrop = document.getElementById('drawerBackdrop');
            backdrop.classList.remove('hidden');
            setTimeout(() => {
                backdrop.classList.remove('opacity-0');
                drawer.classList.remove('-translate-x-full');
            }, 10);
        }

        function closeSideDrawer() {
            const drawer = document.getElementById('sideDrawer');
            const backdrop = document.getElementById('drawerBackdrop');
            drawer.classList.add('-translate-x-full');
            backdrop.classList.add('opacity-0');
            setTimeout(() => {
                backdrop.classList.add('hidden');
            }, 300);
        }

        // ==================== การสลับแท็บเมนูและจัดการช่องค้นหา ====================
        function switchBottomTab(tabName) {
            activePage = tabName;
            updateNavigationUI();
            renderPage();
            lucide.createIcons();
        }

        function navigateTo(pageId, customTitle = '') {
            activePage = pageId;
            window.customPageTitle = customTitle;
            updateNavigationUI();
            renderPage();
            lucide.createIcons();
        }

        function updateNavigationUI() {
            const searchSection = document.getElementById('searchSection');
            const shopCatBar = document.getElementById('shopCategoryBar');

            if (activePage === 'shop') {
                searchSection.classList.remove('hidden');
                shopCatBar.classList.remove('hidden');
            } else {
                searchSection.classList.add('hidden');
                shopCatBar.classList.add('hidden');
            }

            const tabs = ['service', 'shop', 'transaction', 'history', 'promotion'];
            tabs.forEach(t => {
                const btn = document.getElementById(`bnav-${t}`);
                if (!btn) return;
                const oldLine = btn.querySelector('.active-red-line');
                if (oldLine) oldLine.remove();

                const isMatch = (activePage === t) || (t === 'transaction' && activePage === 'withdraw');
                if (isMatch) {
                    btn.classList.remove('text-zinc-500');
                    btn.classList.add('text-zinc-950', 'font-bold');
                    const line = document.createElement('span');
                    line.className = 'active-red-line absolute bottom-0 w-12 h-[3px] bg-[#d91b24] rounded-t-full';
                    btn.appendChild(line);
                } else {
                    btn.classList.add('text-zinc-500');
                    btn.classList.remove('text-zinc-950', 'font-bold');
                }
            });

            document.querySelectorAll('.pc-nav-btn').forEach(btn => {
                const navTarget = btn.getAttribute('data-pc-nav');
                const isMatch = (navTarget === activePage) || (navTarget === 'transaction' && activePage === 'withdraw');
                if (isMatch) {
                    btn.classList.add('bg-zinc-900', 'text-white');
                    btn.classList.remove('text-zinc-600', 'hover:bg-zinc-200/70');
                } else {
                    btn.classList.remove('bg-zinc-900', 'text-white');
                    btn.classList.add('text-zinc-600', 'hover:bg-zinc-200/70');
                }
            });
        }

        function calculateFeeAmount(amount) {
            if (!amount || amount <= 0) return { fee: 0, label: 'ฟรีค่าธรรมเนียม' };
            if (withdrawFeePlan === 'bank_normal') {
                return { fee: 0, label: 'ฟรีค่าธรรมเนียม (3-7 วันทำการ)' };
            }
            if (withdrawFeePlan === 'bank_fast') {
                const f = amount * 0.0299;
                return { fee: f, label: `2.99% (ภายใน 24 ชม.)` };
            }
            if (withdrawFeePlan === 'truemoney') {
                return { fee: 20, label: '20 บาท ต่อรายการ' };
            }
            if (withdrawFeePlan === 'crypto') {
                const f = amount * 0.07;
                return { fee: f, label: '7% (คริปโต)' };
            }
            return { fee: 0, label: 'ฟรีค่าธรรมเนียม' };
        }

        function updateWithdrawSummary() {
            const amtInput = document.getElementById('withdrawAmountInput');
            const feeEl = document.getElementById('wdFeeCalcText');
            const netEl = document.getElementById('wdNetCalcText');
            if (!amtInput || !feeEl || !netEl) return;

            const amt = parseFloat(amtInput.value) || 0;
            const calc = calculateFeeAmount(amt);
            const net = Math.max(0, amt - calc.fee);

            feeEl.textContent = `฿${calc.fee.toFixed(2)} (${calc.label})`;
            netEl.textContent = `฿${net.toFixed(2)}`;
        }

        function submitWithdrawAction() {
            const amtInput = document.getElementById('withdrawAmountInput');
            const amt = parseFloat(amtInput?.value);
            if (!amt || amt <= 0) {
                showToast('กรุณาระบุจำนวนเงินที่ต้องการถอน');
                if (amtInput) amtInput.focus();
                return;
            }
            if (amt > currentBalance) {
                showToast(`ยอดเงินไม่เพียงพอ (ยอดเงินทั้งหมด ฿${currentBalance.toFixed(2)})`);
                return;
            }

            let targetDetail = '';
            if (withdrawChannel === 'bank') {
                const bank = document.getElementById('wdBankSelect')?.value || '';
                const acc = document.getElementById('wdBankAccount')?.value.trim() || '';
                const lockedName = document.getElementById('wdLockedName')?.textContent.trim() || '';
                if (!acc) {
                    showToast('กรุณากรอกเลขที่บัญชีธนาคาร');
                    return;
                }
                targetDetail = `ธนาคาร ${bank} • ${acc} (${lockedName})`;
            } else if (withdrawChannel === 'truemoney') {
                const phone = document.getElementById('wdTruePhone')?.value.trim() || '';
                if (phone.length < 9) {
                    showToast('กรุณากรอกหมายเลขโทรศัพท์ทรูมันนี่ให้ถูกต้อง');
                    return;

                targetDetail = `TrueMoney • ${phone}`;
            } else if (withdrawChannel === 'crypto') {
                const asset = document.getElementById('wdCryptoAsset')?.value || 'USDT';
                const net = document.getElementById('wdCryptoNetwork')?.value || 'TRC20';
                const addr = document.getElementById('wdCryptoAddress')?.value.trim() || '';
                if (!addr) {
                    showToast('กรุณากรอกข้อมูล Wallet Address คริปโต');
                    return;
                }
                targetDetail = `Crypto ${asset} (${net}) • ${addr.slice(0, 10)}...`;
            }

            const calc = calculateFeeAmount(amt);
            currentBalance = Math.max(0, currentBalance - amt);
            orderHistory.unshift({
                id: 'WD-' + Math.floor(1000 + Math.random() * 9000),
                title: `ถอนเงิน [${targetDetail}] • ค่าธรรมเนียม ฿${calc.fee.toFixed(2)}`,

                isPositive: false

            updateBalanceDisplay();
            renderPage();
            lucide.createIcons();
            showToast(`ส่งคำขอถอนเงิน ฿${amt.toFixed(2)} เรียบร้อยแล้ว`);
        }

        function submitGameTopup(gameName, fields) {
            const values = [];
            for (const f of fields) {
                const inputEl = document.getElementById(`gameField_${f.id}`);
                if (!inputEl || !inputEl.value.trim()) {
                    showToast(`กรุณากรอก ${f.label} ให้ครบถ้วน`);
                    if (inputEl) inputEl.focus();
                    return;
                }
                values.push(`${f.label}: ${inputEl.value.trim()}`);
            }
            instantBuy(`เติมเกม ${gameName} (${selectedGamePkgName}) [${values.join(', ')}]`, selectedGamePkgPrice);
        }

        function updateTelecomQty(delta, unitPrice) {
            const input = document.getElementById('telecomQtyInput');

            input.value = val;
            document.getElementById('telecomTotalText').textContent = `฿${(val * unitPrice).toLocaleString()}`;
        }

        function submitTelecomOrder(title, unitPrice, isTopupCard) {
            const qty = parseInt(document.getElementById('telecomQtyInput').value) || 1;
            const total = qty * unitPrice;
            if (!isTopupCard) {
                const phone = document.getElementById('telecomPhoneInput').value.trim();
                const carrier = document.querySelector('input[name="carrier"]:checked').value;
                if (phone.length < 9) {
                    showToast('กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง');
                    return;
                }
                instantBuy(`${title} [${carrier}: ${phone}] x${qty}`, total);
            } else {
                instantBuy(`${title} x${qty}`, total);
            }
        }

        function initSmmUI() {
            const tabsEl = document.getElementById('smmPlatformTabs');
            if (!tabsEl) return;
            tabsEl.innerHTML = '';
            SMM_PLATFORMS.forEach(plat => {
                const isActive = plat.id === smmState.platform;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.dataset.id = plat.id;
                btn.className = `flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all shrink-0 ${
                    isActive ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-800 hover:bg-white/50'
                }`;
                btn.innerHTML = `<i class="${plat.icon} ${isActive ? plat.color : 'text-gray-400'}"></i><span>${plat.name}</span>`;
                btn.addEventListener('click', () => {
                    smmState.platform = plat.id;
                    initSmmUI();
                    setTimeout(() => {
                        const activeBtn = tabsEl.querySelector(`button[data-id="${plat.id}"]`);
                        if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }, 10);
                });
                tabsEl.appendChild(btn);
            });

            const searchEl = document.getElementById('smmSearchInput');
            const qtyEl = document.getElementById('smmQuantityInput');
            if (searchEl) {
                searchEl.value = smmState.search;
                searchEl.oninput = () => {
                    smmState.search = searchEl.value;
                    document.getElementById('smmClearSearchBtn').classList.toggle('hidden', !smmState.search);
                    updateSmmCategoriesAndServices();
                };
            }
            if (qtyEl) {
                qtyEl.oninput = calculateSmmTotal;
            }
            updateSmmCategoriesAndServices();
        }

        function clearSmmSearch() {
            smmState.search = '';
            const searchEl = document.getElementById('smmSearchInput');
            if (searchEl) searchEl.value = '';
            document.getElementById('smmClearSearchBtn').classList.add('hidden');
            updateSmmCategoriesAndServices();
        }

        function toggleSmmDropdown(type) {
            const catMenu = document.getElementById('smmCategoryDropdownMenu');
            const srvMenu = document.getElementById('smmServiceDropdownMenu');
            const catArrow = document.getElementById('smmCategoryArrow');
            const srvArrow = document.getElementById('smmServiceArrow');

            if (type === 'category') {
                const isHidden = catMenu.classList.contains('hidden');
                srvMenu.classList.add('hidden');
                srvArrow.classList.remove('rotate-180');
                catMenu.classList.toggle('hidden', !isHidden);
                catArrow.classList.toggle('rotate-180', isHidden);
            } else {
                const isHidden = srvMenu.classList.contains('hidden');
                catMenu.classList.add('hidden');
                catArrow.classList.remove('rotate-180');
                srvMenu.classList.toggle('hidden', !isHidden);
                srvArrow.classList.toggle('rotate-180', isHidden);
            }
        }

        function updateSmmCategoriesAndServices() {
            const keyword = smmState.search.trim().toLowerCase();
            smmFilteredServices = SMM_SERVICES_DATA.filter(item => {
                const matchPlatform = (smmState.platform === 'all') || (item.platform === smmState.platform);
                const matchKeyword = !keyword || item.name.toLowerCase().includes(keyword) || item.category.toLowerCase().includes(keyword) || item.id.toString().includes(keyword);
                return matchPlatform && matchKeyword;
            });

            const categoryMap = new Map();
            smmFilteredServices.forEach(s => {
                if (!categoryMap.has(s.category)) categoryMap.set(s.category, s.region);
            });

            const catMenuEl = document.getElementById('smmCategoryDropdownMenu');
            const catDisplayEl = document.getElementById('smmCategorySelectedDisplay');
            catMenuEl.innerHTML = '';

            if (categoryMap.size === 0) {
                catDisplayEl.innerHTML = `<span class="text-gray-400">ไม่พบหมวดหมู่ที่ตรงกับการค้นหา</span>`;
                document.getElementById('smmServiceSelectedDisplay').innerHTML = `<span class="text-gray-400">ไม่พบบริการ</span>`;
                document.getElementById('smmServiceDropdownMenu').innerHTML = '';
                smmSelectedService = null;
                calculateSmmTotal();
                return;
            }

            categoryMap.forEach((region, catName) => {
                const itemBtn = document.createElement('button');
                itemBtn.type = 'button';
                itemBtn.className = 'w-full px-4 py-2.5 text-left text-sm hover:bg-gray-50 flex items-center gap-2.5 transition border-b border-gray-50 last:border-none';
                itemBtn.innerHTML = `${getRegionBadgeHTML(region)}<span class="text-gray-800 font-medium truncate">${catName}</span>`;
                itemBtn.addEventListener('click', () => {
                    selectSmmCategory(catName, region);
                    catMenuEl.classList.add('hidden');
                    document.getElementById('smmCategoryArrow').classList.remove('rotate-180');
                });
                catMenuEl.appendChild(itemBtn);
            });

            const firstEntry = categoryMap.entries().next().value;
            selectSmmCategory(firstEntry[0], firstEntry[1]);
        }

        function selectSmmCategory(catName, region) {
            document.getElementById('smmCategorySelectedDisplay').innerHTML = `${getRegionBadgeHTML(region)}<span class="text-gray-800 font-medium truncate">${catName}</span>`;
            const servicesInCat = smmFilteredServices.filter(s => s.category === catName);
            const srvMenuEl = document.getElementById('smmServiceDropdownMenu');
            srvMenuEl.innerHTML = '';

            servicesInCat.forEach(srv => {
                const itemBtn = document.createElement('button');
                itemBtn.type = 'button';
                itemBtn.className = 'w-full px-4 py-2.5 text-left text-sm hover:bg-gray-50 flex items-center justify-between gap-2 transition border-b border-gray-50 last:border-none';
                itemBtn.innerHTML = `
                    <div class="flex items-center gap-2.5 min-w-0">
                        ${getSocialIconHTML(srv.socialType)}
                        <span class="text-gray-800 font-medium truncate">${srv.name}</span>
                    </div>
                    <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md shrink-0">฿${srv.rate.toFixed(2)}</span>
                `;
                itemBtn.addEventListener('click', () => {
                    updateSmmServiceDetails(srv);
                    srvMenuEl.classList.add('hidden');
                    document.getElementById('smmServiceArrow').classList.remove('rotate-180');
                });
                srvMenuEl.appendChild(itemBtn);
            });

            if (servicesInCat.length > 0) updateSmmServiceDetails(servicesInCat[0]);
        }

        function updateSmmServiceDetails(service) {
            smmSelectedService = service;
            document.getElementById('smmServiceSelectedDisplay').innerHTML = `${getSocialIconHTML(service.socialType)}<span class="text-gray-800 font-medium truncate">${service.name}</span>`;
            document.getElementById('smmServiceRateText').textContent = `เรทราคา: ฿${service.rate.toFixed(2)} / 1,000`;
            document.getElementById('smmServiceMinMaxText').textContent = `ขั้นต่ำ: ${service.min.toLocaleString()} - สูงสุด: ${service.max.toLocaleString()}`;

            const qtyEl = document.getElementById('smmQuantityInput');
            qtyEl.min = service.min;
            qtyEl.max = service.max;
            qtyEl.placeholder = `ขั้นต่ำ ${service.min.toLocaleString()}`;

            const linkEl = document.getElementById('smmLinkInput');
            linkEl.placeholder = `วางลิงก์ ${service.platformLabel} ที่นี่...`;
            document.getElementById('smmPlatformLinkHint').innerHTML = `
                <i class="fa-solid fa-link text-blue-600 shrink-0"></i>
                <span>ต้องเป็นลิงก์ของแพลตฟอร์ม: <strong class="underline">${service.platformLabel}</strong> (เช่น ${service.linkExample})</span>
            `;
            calculateSmmTotal();
        }

        function calculateSmmTotal() {
            const totalEl = document.getElementById('smmTotalPriceDisplay');
            if (!totalEl) return;
            if (!smmSelectedService) {
                totalEl.textContent = '฿0.00';
                return;
            }
            const qty = parseFloat(document.getElementById('smmQuantityInput').value) || 0;
            const total = (qty / 1000) * smmSelectedService.rate;
            totalEl.textContent = `฿${total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        async function pasteSmmLink() {
            const linkEl = document.getElementById('smmLinkInput');
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    linkEl.value = text;
                    linkEl.focus();
                    showToast('วางลิงก์จากคลิปบอร์ดเรียบร้อย');
                    return;
                }
            } catch (err) {}
            if (smmSelectedService) {
                linkEl.value = smmSelectedService.linkExample;
                showToast('วางลิงก์ตัวอย่างเรียบร้อย');
            }
        }

        function handleSmmOrderSubmit(e) {
            e.preventDefault();
            if (!smmSelectedService) {
                showToast('กรุณาเลือกบริการที่ต้องการสั่งซื้อ');
                return;
            }
            const qty = parseInt(document.getElementById('smmQuantityInput').value) || 0;
            if (qty < smmSelectedService.min || qty > smmSelectedService.max) {
                showToast(`กรุณาระบุจำนวนระหว่าง ${smmSelectedService.min.toLocaleString()} ถึง ${smmSelectedService.max.toLocaleString()}`);
                return;
            }
            const total = parseFloat(((qty / 1000) * smmSelectedService.rate).toFixed(2));
            instantBuy(`${smmSelectedService.name} (${qty.toLocaleString()} รายการ)`, total);
        }

        const GUIDE_CONTENTS = {
            steps: {
                title: 'ขั้นตอนการใช้งานระบบปั๊มยอด',
                icon: 'fa-solid fa-list-check',
                iconClass: 'bg-indigo-100 text-indigo-600',
                html: `<p class="text-xs text-gray-600">1. เลือกแพลตฟอร์มและหมวดหมู่ (คนไทย หรือ ต่างประเทศ)<br>2. เลือกบริการย่อยและตรวจสอบเรทราคา<br>3. วางลิงก์สาธารณะ (Public Link)<br>4. ระบุจำนวนและกดยืนยันการสั่งซื้อ</p>`
            },
            public_link: {
                title: 'วิธีตั้งค่าบัญชี & ลิงก์ให้เป็นสาธารณะ',
                icon: 'fa-solid fa-globe',
                iconClass: 'bg-blue-100 text-blue-600',
                html: `<p class="text-xs text-gray-600">กรุณาตั้งค่าโพสต์หรือโปรไฟล์เป็น <strong>สาธารณะ (Public)</strong> ก่อนกดสั่งซื้อทุกครั้ง หากตั้งค่าเป็นส่วนตัวระบบจะไม่สามารถส่งยอดได้</p>`
            },
            copy_link: {
                title: 'วิธีค้นหาและคัดลอกลิงก์ที่ถูกต้อง',
                icon: 'fa-solid fa-link',
                iconClass: 'bg-amber-100 text-amber-600',
                html: `<p class="text-xs text-gray-600">กดปุ่ม <strong>"แชร์ (Share)"</strong> ที่ใต้โพสต์หรือหน้าโปรไฟล์ แล้วเลือก <strong>"คัดลอกลิงก์ (Copy Link)"</strong> จากนั้นกดปุ่ม <strong>"วางลิงก์"</strong> ในช่องกรอก</p>`
            },
            rules: {
                title: 'ข้อควรระวังก่อนกดสั่งซื้อ',
                icon: 'fa-solid fa-shield-halved',
                iconClass: 'bg-rose-100 text-rose-600',
                html: `<p class="text-xs text-gray-600">ห้ามสั่งซื้อซ้ำซ้อนในลิงก์เดิมขณะออเดอร์เก่ายังขึ้นไม่ครบ และห้ามเปลี่ยนชื่อบัญชีระหว่างรอระบบดำเนินการ</p>`
            }
        };

        function openGuideModal(key) {
            const data = GUIDE_CONTENTS[key];
            if (!data) return;
            const modal = document.getElementById('guideModal');
            document.getElementById('guideModalIcon').className = `w-9 h-9 rounded-xl ${data.iconClass} flex items-center justify-center text-base`;
            document.getElementById('guideModalIcon').innerHTML = `<i class="${data.icon}"></i>`;
            document.getElementById('guideModalTitle').textContent = data.title;
            document.getElementById('guideModalBody').innerHTML = data.html;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeGuideModal() {
            const modal = document.getElementById('guideModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // ==================== ระบบฝากเงินหน้าธุรกรรม ====================
        function selectDepositMethod(methodId) {
            const currentInputVal = document.getElementById('depositAmountInput')?.value || '';
            depositMethod = methodId;
            renderPage();
            lucide.createIcons();
            const newInput = document.getElementById('depositAmountInput');
            if (newInput) newInput.value = currentInputVal;
        }

        function confirmDepositAction() {
            const inputEl = document.getElementById('depositAmountInput');
            const amount = parseFloat(inputEl?.value);
            if (!amount || amount <= 0) {
                showToast('กรุณากรอกจำนวนเงินที่ต้องการฝาก (มากกว่า ฿0.00)');
                if (inputEl) inputEl.focus();
                return;
            }
            const methodNames = {
                qr: 'คิวอาร์พร้อมเพย์',
                bank: 'โอนผ่านธนาคาร',
                truemoney: 'ทรูมันนี่ (TrueMoney)',
                crypto: 'คริปโต (USDT)'
            };
            currentBalance += amount;
            orderHistory.unshift({
                id: 'DEP-' + Math.floor(1000 + Math.random() * 9000),
                title: `ฝากเงินเข้ากระเป๋า (${methodNames[depositMethod]})`,
                date: 'เมื่อสักครู่ • สำเร็จอัตโนมัติ',
                amount: `+฿${amount.toFixed(2)}`,
                isPositive: true
            });
            updateBalanceDisplay();
            renderPage();
            lucide.createIcons();
            showToast(`ฝากเงินผ่าน ${methodNames[depositMethod]} จำนวน +฿${amount.toFixed(2)} สำเร็จ!`);
        }

        // ==================== ระบบตะกร้าสินค้าและการชำระเงิน ====================
        function addToCart(title, price) {
            const existing = cartItems.find(i => i.title === title);
            if (existing) {
                existing.qty += 1;
            } else {
                cartItems.push({ title, price, qty: 1 });
            }
            updateBalanceDisplay();
            showToast(`เพิ่ม "${title}" ลงตะกร้าแล้ว`);
        }

        function removeFromCart(index) {
            cartItems.splice(index, 1);
            updateBalanceDisplay();
            renderPage();
            lucide.createIcons();
        }

        function checkoutCart() {
            const total = cartItems.reduce((sum, item) => sum + (item.price * item.qty), 0);
            if (currentBalance < total) {
                showToast('ยอดเงินไม่เพียงพอ กรุณากดฝากเงินก่อนทำรายการ');
                return;
            }
            currentBalance -= total;
            cartItems.forEach(item => {
                orderHistory.unshift({
                    id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                    title: `${item.title} (x${item.qty})`,
                    date: 'เมื่อสักครู่ • สำเร็จอัตโนมัติ',
                    amount: `-฿${(item.price * item.qty).toFixed(2)}`,
                    isPositive: false
                });
            });
            cartItems = [];
            updateBalanceDisplay();
            showToast('ชำระเงินสำเร็จ! จัดส่งสินค้าอัตโนมัติแล้ว');
            switchBottomTab('history');
        }

        function instantBuy(title, price) {
            if (currentBalance < price) {
                showToast(`ยอดเงินคงเหลือไม่พอ (ต้องการ ฿${price.toFixed(2)}) กรุณาฝากเงินเพิ่ม`);
                return;
            }
            currentBalance -= price;
            orderHistory.unshift({
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                title: title,
                date: 'เมื่อสักครู่ • สำเร็จอัตโนมัติ',
                amount: `-฿${price.toFixed(2)}`,
                isPositive: false
            });
            updateBalanceDisplay();
            closeDetailModal();
            showToast('ทำรายการสั่งซื้อและชำระเงินสำเร็จ!');
        }

        function closeDetailModal() {
            document.getElementById('productDetailModal').classList.add('hidden');
        }

        function handleRecommendedClick(id) {
            activeShopCategory = id;
            renderShopTabs();
            switchBottomTab('shop');
        }

        // ==================== ระบบค้นหา & ยอดเงิน & Utility ====================
        function handleSearch(val) {
            searchQuery = val.trim();
            document.getElementById('clearSearchBtn').classList.toggle('hidden', searchQuery.length === 0);
            renderPage();
            lucide.createIcons();
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            handleSearch('');
            input.focus();
        }

        function toggleBalanceDropdown() {
            document.getElementById('balanceDropdown').classList.toggle('hidden');
        }

        function copyText(text) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast(`คัดลอก "${text}" เรียบร้อยแล้ว`);
        }

        function openSettingsModal() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2600);
        }

        document.addEventListener('click', (e) => {
            const btn = document.getElementById('balanceBtn');
            const dropdown = document.getElementById('balanceDropdown');
            if (btn && dropdown && !btn.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
            const smmCatWrap = document.getElementById('smmCategoryDropdownWrapper');
            const smmSrvWrap = document.getElementById('smmServiceDropdownWrapper');
            if (smmCatWrap && !smmCatWrap.contains(e.target)) {
                document.getElementById('smmCategoryDropdownMenu')?.classList.add('hidden');
                document.getElementById('smmCategoryArrow')?.classList.remove('rotate-180');
            }
            if (smmSrvWrap && !smmSrvWrap.contains(e.target)) {
                document.getElementById('smmServiceDropdownMenu')?.classList.add('hidden');
                document.getElementById('smmServiceArrow')?.classList.remove('rotate-180');
            }
        });

        window.onload = initApp;
    </script>
</body>
</html>
