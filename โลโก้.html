<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yahaterm Loading</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fff;
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Kanit', sans-serif;
}

.container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
}

.logo {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    font-size: clamp(38px, 10vw, 76px);
    font-weight: 800;
    letter-spacing: -3px;
    z-index: 2;
}

/* วงกลมทั้งหมด */

.orbit {
    position: absolute;
    width: 145px;
    height: 145px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
}

/* เส้นวงกลม */

.solid-ring {
    border: 2px solid rgba(0, 188, 180, .55);
    border-radius: 50%;
}

/* วงไข่ปลา */

.dot-ring {
    width: 165px;
    height: 165px;
    border-radius: 50%;

    background: repeating-conic-gradient(
        from 0deg,
        #00cba5 0deg 3deg,
        transparent 3deg 12deg,
        #078ee8 12deg 15deg,
        transparent 15deg 24deg
    );

    -webkit-mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 5px),
        #000 calc(100% - 4px)
    );

    mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 5px),
        #000 calc(100% - 4px)
    );
}

/* วงแหวนด้านนอก */

.outer-ring {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    border: 1px solid rgba(0, 137, 220, .15);
}

/* ตัวอักษร */

.letter {
    display: inline-block;
    opacity: 0;
    position: relative;
    will-change: transform, opacity;
}

.letter:nth-child(1),
.letter:nth-child(2) {
    color: #00bfa5;
}

.letter:nth-child(3),
.letter:nth-child(4),
.letter:nth-child(5) {
    color: #303e60;
}

.letter:nth-child(6),
.letter:nth-child(7),
.letter:nth-child(8) {
    color: #078de0;
}

/* แสงตอนประกอบโลโก้ */

.logo.finished {
    filter: drop-shadow(0 3px 12px rgba(0,180,190,.10));
}

/* หมุนวงกลม 2 รอบ */

.orbit.play {
    animation: appear .3s ease forwards,
               rotateTwo 1.8s cubic-bezier(.45,0,.2,1) forwards;
}

@keyframes appear {
    to { opacity: 1; }
}

@keyframes rotateTwo {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
        transform: translate(-50%, -50%) rotate(720deg);
    }
}

/* มือถือ */

@media(max-width:480px) {
    .orbit {
        width: 120px;
        height: 120px;
    }

    .dot-ring {
        width: 140px;
        height: 140px;
    }

    .outer-ring {
        width: 160px;
        height: 160px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo" id="logo">

        <div class="orbit outer-ring" id="outer"></div>
        <div class="orbit solid-ring" id="solid"></div>
        <div class="orbit dot-ring" id="dots"></div>

        <span class="letter">Y</span>
        <span class="letter">a</span>
        <span class="letter">h</span>
        <span class="letter">a</span>
        <span class="letter">t</span>
        <span class="letter">e</span>
        <span class="letter">r</span>
        <span class="letter">m</span>

    </div>

</div>

<script>

const logo = document.getElementById('logo');
const letters = document.querySelectorAll('.letter');

const rings = [
    document.getElementById('outer'),
    document.getElementById('solid'),
    document.getElementById('dots')
];

function startAnimation() {

    // แสดงวงกลมและหมุน 2 รอบ
    rings.forEach((ring, index) => {

        ring.animate([
            {
                opacity: 0,
                transform: 'translate(-50%,-50%) rotate(0deg)'
            },
            {
                opacity: 1,
                transform: `translate(-50%,-50%) rotate(${index % 2 ? -720 : 720}deg)`
            }
        ], {
            duration: 1800,
            delay: index * 100,
            easing: 'cubic-bezier(.45,0,.2,1)',
            fill: 'forwards'
        });

    });

    // ให้ตัวอักษรวิ่งวนและประกอบเป็นชื่อ
    setTimeout(() => {

        const rect = logo.getBoundingClientRect();

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const radius = 82;
        const total = letters.length;

        letters.forEach((letter, index) => {

            const box = letter.getBoundingClientRect();

            const targetX =
                box.left - rect.left + box.width / 2 - centerX;

            const targetY =
                box.top - rect.top + box.height / 2 - centerY;

            const angle = index / total * Math.PI * 2;

            const startX = Math.cos(angle) * radius - targetX;
            const startY = Math.sin(angle) * radius - targetY;

            letter.animate([
                {
                    opacity: 0,
                    transform: `translate(${startX}px,${startY}px) rotate(0deg)`
                },
                {
                    opacity: 1,
                    offset: .1,
                    transform: `translate(${startX}px,${startY}px) rotate(0deg)`
                },
                {
                    opacity: 1,
                    offset: .7,
                    transform: `
                        translate(${startX}px,${startY}px)
                        rotate(720deg)
                    `
                },
                {
                    opacity: 1,
                    transform: 'translate(0,0) rotate(0deg)'
                }
            ], {
                duration: 1500,
                delay: index * 80,
                easing: 'cubic-bezier(.16,1,.3,1)',
                fill: 'forwards'
            });

        });

        setTimeout(() => {
            logo.classList.add('finished');
        }, 1800);

    }, 1300);

}

window.addEventListener('load', () => {
    setTimeout(startAnimation, 300);
});

</script>

</body>
</html>
