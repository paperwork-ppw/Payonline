<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบปั๊มไลก์ & เพิ่มยอดโซเชียลอัตโนมัติ</title>
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้าฟอนต์ Prompt และ Inter เพื่อความสวยงามและอ่านง่าย -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- นำเข้า FontAwesome สำหรับไอคอนแพลตฟอร์มต่างๆ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Prompt', 'Inter', sans-serif;
            background-color: #18181b; /* พื้นหลังด้านบนสีเข้มเหมือนหน้าต่างโมดอลในแอป */
            -webkit-tap-highlight-color: transparent;
        }

        /* ซ่อน Scrollbar ของแถบเมนูแพลตฟอร์มแต่ยังเลื่อนได้ลื่นไหล */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ปรับแต่งลูกศรของ Select Box ให้ดูเรียบหรู */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1.1em;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-end sm:justify-center items-center sm:p-4">

    <!-- Container หลักจำลองหน้าต่างแอปพลิเคชันโค้งมนด้านบนเหมือนในภาพ -->
    <div class="w-full max-w-md bg-white min-h-[94vh] sm:min-h-0 sm:rounded-[32px] rounded-t-[32px] shadow-2xl flex flex-col justify-between overflow-hidden transition-all duration-300">
        
        <div class="p-6 pb-8">
            <!-- ส่วนหัว (Header): โลโก้ + ชื่อระบบ + ยอดเงินคงเหลือ -->
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-3">
                    <!-- โลโก้สีแดงโค้งมนสไตล์เดียวกับภาพตัวอย่าง -->
                    <div class="w-11 h-11 rounded-2xl bg-[#f42236] flex items-center justify-center text-white shadow-md shadow-red-500/20 shrink-0">
                        <i class="fa-solid fa-bolt text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-gray-900 leading-tight">สั่งซื้อบริการปั๊มยอด</h1>
                        <p class="text-xs text-gray-400">ระบบอัตโนมัติ 24 ชั่วโมง</p>
                    </div>
                </div>
                
                <!-- ปุ่มแสดงเครดิตคงเหลือ (สไตล์เดียวกับตัวเลือกภาษา "ไทย v" ในรูป) -->
                <button type="button" onclick="showToast('ยอดเงินคงเหลือของคุณคือ ฿1,250.00')" class="flex items-center gap-1.5 text-sm font-semibold text-gray-700 bg-gray-50 hover:bg-gray-100 px-3 py-2 rounded-xl transition">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span>฿1,250.00</span>
                    <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 ml-0.5"></i>
                </button>
            </div>

            <!-- แถบหัวเมนูแพลตฟอร์ม: สลับได้ และเลื่อนแนวนอนได้ (Segmented Control Style) -->
            <div class="bg-[#f3f4f6] p-1.5 rounded-2xl mb-5 relative">
                <div id="platformTabs" class="flex items-center gap-1 overflow-x-auto no-scrollbar scroll-smooth">
                    <!-- ปุ่มแท็บจะถูกสร้างด้วย JavaScript เพื่อให้จัดการสถานะ Active ได้แม่นยำ -->
                </div>
            </div>

            <!-- ฟอร์มสั่งซื้อบริการ -->
            <form id="orderForm" class="space-y-3.5" onsubmit="handleOrderSubmit(event)">
                
                <!-- 1. ช่องค้นหาไอดี หรือคีย์เวิร์ด -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i>
                    </div>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="ค้นหาไอดีบริการ หรือ คีย์เวิร์ด (เช่น ไลก์คนไทย, ผู้ติดตาม)..." 
                        class="w-full bg-[#f3f4f6] text-gray-800 placeholder-gray-400 text-sm rounded-2xl pl-10 pr-9 py-3.5 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:bg-white border border-transparent focus:border-gray-200 transition"
                    >
                    <button type="button" id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600">
                        <i class="fa-solid fa-circle-xmark text-sm"></i>
                    </button>
                </div>

                <!-- 2. ช่องเลือกหมวดหมู่ -->
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1.5 ml-1">เลือกหมวดหมู่บริการ</label>
                    <div class="relative">
                        <select id="categorySelect" class="w-full bg-[#f3f4f6] text-gray-800 text-sm font-medium rounded-2xl px-4 py-3.5 pr-10 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:bg-white border border-transparent focus:border-gray-200 transition cursor-pointer">
                            <!-- ตัวเลือกหมวดหมู่จะอัปเดตตามหัวเมนูที่เลือก -->
                        </select>
                    </div>
                </div>

                <!-- 3. ช่องเลือกบริการ -->
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1.5 ml-1">เลือกบริการ</label>
                    <div class="relative">
                        <select id="serviceSelect" class="w-full bg-[#f3f4f6] text-gray-800 text-sm font-medium rounded-2xl px-4 py-3.5 pr-10 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:bg-white border border-transparent focus:border-gray-200 transition cursor-pointer">
                            <!-- ตัวเลือกบริการจะอัปเดตตามหมวดหมู่ -->
                        </select>
                    </div>
                    <!-- กล่องรายละเอียดบริการย่อ (เรทราคา / ขั้นต่ำ-สูงสุด) -->
                    <div id="serviceMeta" class="mt-2 px-3 py-2 bg-gray-50 rounded-xl border border-gray-100 flex items-center justify-between text-[11px] text-gray-500">
                        <span id="serviceRateText">เรท: ฿0.00 / 1,000</span>
                        <span id="serviceMinMaxText">ขั้นต่ำ: 10 - สูงสุด: 10,000</span>
                    </div>
                </div>

                <!-- 4. ช่องวางลิงก์ของแพลตฟอร์ม + ข้อความระบุแพลตฟอร์มด้านล่าง -->
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1.5 ml-1">ลิงก์เป้าหมาย</label>
                    <div class="relative">
                        <input 
                            type="url" 
                            id="linkInput" 
                            required
                            placeholder="วางลิงก์ที่นี่..." 
                            class="w-full bg-[#f3f4f6] text-gray-800 placeholder-gray-400 text-sm rounded-2xl pl-4 pr-16 py-3.5 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:bg-white border border-transparent focus:border-gray-200 transition"
                        >
                        <!-- ปุ่มวางลิงก์ด่วน -->
                        <button type="button" onclick="pasteLink()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-white text-gray-600 hover:text-gray-900 text-xs font-medium px-2.5 py-1.5 rounded-xl shadow-sm border border-gray-100 transition">
                            วางลิงก์
                        </button>
                    </div>
                    <!-- ข้อความใต้ฟอร์มบอกว่าเป็นลิงก์ของแพลตฟอร์มไหน (เปลี่ยนอัตโนมัติตามแพลตฟอร์ม) -->
                    <div id="platformLinkHint" class="mt-1.5 ml-1 flex items-center gap-1.5 text-xs font-medium text-blue-600">
                        <i class="fa-solid fa-circle-info"></i>
                        <span>กรุณาวางลิงก์ของแพลตฟอร์ม: Facebook (ตัวอย่าง: https://www.facebook.com/...)</span>
                    </div>
                </div>

                <!-- 5. ระบุจำนวนที่ต้องการ และ 6. ค่าบริการที่ต้องชำระ (จัดวางคู่กันหรือเรียงสวยแบบฟอร์มในภาพ) -->
                <div class="grid grid-cols-2 gap-3 pt-1">
                    <!-- ระบุจำนวนที่ต้องการ -->
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1.5 ml-1">จำนวนที่ต้องการ</label>
                        <input 
                            type="number" 
                            id="quantityInput" 
                            required
                            min="10"
                            placeholder="ระบุจำนวน" 
                            class="w-full bg-[#f3f4f6] text-gray-900 font-semibold placeholder-gray-400 text-sm rounded-2xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:bg-white border border-transparent focus:border-gray-200 transition"
                        >
                    </div>

                    <!-- ค่าบริการที่ต้องชำระ -->
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1.5 ml-1">ค่าบริการที่ต้องชำระ</label>
                        <div class="w-full bg-[#f3f4f6] rounded-2xl px-4 py-3.5 flex items-center justify-between border border-transparent">
                            <span id="totalPriceDisplay" class="text-sm font-bold text-gray-900">฿0.00</span>
                            <span class="text-[11px] font-medium text-gray-400">THB</span>
                        </div>
                    </div>
                </div>

                <!-- ปุ่มยืนยันการสั่งซื้อสีดำเข้มเต็มความกว้าง เหมือนปุ่ม "สร้างบัญชี" ในรูปต้นแบบ -->
                <div class="pt-3">
                    <button type="submit" class="w-full bg-[#09090b] hover:bg-zinc-800 active:scale-[0.99] text-white font-semibold text-sm py-4 rounded-2xl shadow-lg shadow-black/15 transition-all flex items-center justify-center gap-2">
                        <span>ยืนยันการสั่งซื้อบริการ</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </div>

            </form>

            <!-- ส่วนล่างสุด: ทางลัดเติมเงิน / ประวัติการสั่งซื้อ (สไตล์เดียวกับ "หรือ สมัครผ่าน" + 4 ปุ่มด้านล่างในภาพ) -->
            <div class="mt-6">
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-100"></div>
                    <span class="flex-shrink mx-3 text-xs text-gray-400">เมนูลัดจัดการบัญชี</span>
                    <div class="flex-grow border-t border-gray-100"></div>
                </div>

                <div class="grid grid-cols-4 gap-2.5 mt-3">
                    <button type="button" onclick="showToast('เปิดหน้าประวัติการสั่งซื้อ')" class="flex flex-col items-center justify-center p-3 rounded-2xl border border-gray-100 bg-white hover:bg-gray-50 transition shadow-sm">
                        <i class="fa-solid fa-clock-rotate-left text-blue-500 text-lg mb-1"></i>
                        <span class="text-[11px] font-medium text-gray-700">ประวัติสั่งซื้อ</span>
                    </button>
                    <button type="button" onclick="showToast('เปิดหน้าเติมเงินเข้าระบบ')" class="flex flex-col items-center justify-center p-3 rounded-2xl border border-gray-100 bg-white hover:bg-gray-50 transition shadow-sm">
                        <i class="fa-solid fa-wallet text-emerald-500 text-lg mb-1"></i>
                        <span class="text-[11px] font-medium text-gray-700">เติมเครดิต</span>
                    </button>
                    <button type="button" onclick="showToast('เปิดดูเรทราคาทั้งหมด')" class="flex flex-col items-center justify-center p-3 rounded-2xl border border-gray-100 bg-white hover:bg-gray-50 transition shadow-sm">
                        <i class="fa-solid fa-tags text-amber-500 text-lg mb-1"></i>
                        <span class="text-[11px] font-medium text-gray-700">เรทราคา</span>
                    </button>
                    <button type="button" onclick="showToast('ติดต่อแอดมินผ่าน LINE')" class="flex flex-col items-center justify-center p-3 rounded-2xl border border-gray-100 bg-white hover:bg-gray-50 transition shadow-sm">
                        <i class="fa-brands fa-line text-[#06c755] text-lg mb-1"></i>
                        <span class="text-[11px] font-medium text-gray-700">ติดต่อเรา</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal / Toast แจ้งเตือนแบบนุ่มนวล (ไม่ใช้ alert()) -->
    <div id="toastModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl transform transition-all text-center">
            <div id="toastIcon" class="w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 id="toastTitle" class="text-lg font-bold text-gray-900 mb-1">ทำรายการสำเร็จ</h3>
            <p id="toastMessage" class="text-sm text-gray-500 mb-5 leading-relaxed">รายละเอียดคำสั่งซื้อของคุณถูกส่งเข้าสู่ระบบเรียบร้อยแล้ว</p>
            <button type="button" onclick="closeToast()" class="w-full bg-gray-900 text-white font-medium text-sm py-3.5 rounded-2xl hover:bg-gray-800 transition">
                ตกลง
            </button>
        </div>
    </div>

            // YouTube
            { id: 501, platform: 'youtube', platformLabel: 'YouTube (ลิงก์วิดีโอ หรือ Shorts)', linkExample: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ', category: 'YouTube - เพิ่มยอดวิว (Views)', name: 'ID 501 - เพิ่มยอดวิว YouTube คุณภาพสูง (ไม่ลด)', rate: 42.00, min: 100, max: 500000 },
            { id: 502, platform: 'youtube', platformLabel: 'YouTube (ลิงก์ช่อง YouTube Channel)', linkExample: 'https://www.youtube.com/@YourChannel', category: 'YouTube - เพิ่มผู้ติดตามช่อง (Subscribers)', name: 'ID 502 - เพิ่มซับ YouTube รับประกัน 30 วัน', rate: 280.00, min: 50, max: 10000 },

            // Twitter (X)
            { id: 601, platform: 'twitter', platformLabel: 'Twitter / X (ลิงก์ทวีตโพสต์)', linkExample: 'https://x.com/username/status/17283910293', category: 'Twitter (X) - ปั๊มหัวใจ & รีทวีต', name: 'ID 601 - ปั๊มหัวใจโพสต์ Twitter (X) ขึ้นไว', rate: 28.00, min: 50, max: 50000 },
            { id: 602, platform: 'twitter', platformLabel: 'Twitter / X (ลิงก์โปรไฟล์)', linkExample: 'https://x.com/yourusername', category: 'Twitter (X) - เพิ่มผู้ติดตาม', name: 'ID 602 - เพิ่มผู้ติดตาม Twitter (X) คุณภาพสูง', rate: 65.00, min: 50, max: 25000 },

            // Shopee
            { id: 701, platform: 'shopee', platformLabel: 'Shopee (ลิงก์ร้านค้า Shopee)', linkExample: 'https://shopee.co.th/yourshopname', category: 'Shopee - เพิ่มผู้ติดตามร้านค้า', name: 'ID 701 - เพิ่มผู้ติดตามร้านค้า Shopee (เพิ่มความน่าเชื่อถือ)', rate: 49.00, min: 100, max: 50000 },
            { id: 702, platform: 'shopee', platformLabel: 'Shopee (ลิงก์สินค้า)', linkExample: 'https://shopee.co.th/product/12345/67890', category: 'Shopee - ปั๊มถูกใจสินค้า', name: 'ID 702 - ปั๊มกดหัวใจสินค้า Shopee ดันอันดับค้นหา', rate: 35.00, min: 50, max: 20000 },

            // Twitch
            { id: 801, platform: 'twitch', platformLabel: 'Twitch (ลิงก์ช่องสตรีม)', linkExample: 'https://www.twitch.tv/yourchannel', category: 'Twitch - เพิ่มผู้ติดตามช่อง', name: 'ID 801 - เพิ่มผู้ติดตาม Twitch (Followers) งานไว', rate: 32.00, min: 50, max: 50000 },
            { id: 802, platform: 'twitch', platformLabel: 'Twitch (ลิงก์ช่องขณะไลฟ์สด)', linkExample: 'https://www.twitch.tv/yourchannel', category: 'Twitch - คนดูสตรีมสด', name: 'ID 802 - คนดูไลฟ์สด Twitch 30 นาที', rate: 110.00, min: 20, max: 2000 },

            // อื่นๆ
            { id: 901, platform: 'other', platformLabel: 'Telegram (ลิงก์ช่อง หรือ กลุ่ม)', linkExample: 'https://t.me/yourchannel', category: 'อื่นๆ - Telegram / Discord / Threads', name: 'ID 901 - เพิ่มสมาชิกช่อง Telegram (ไม่ลด)', rate: 45.00, min: 100, max: 100000 },
            { id: 902, platform: 'other', platformLabel: 'Threads (ลิงก์โปรไฟล์ Threads)', linkExample: 'https://www.threads.net/@username', category: 'อื่นๆ - Telegram / Discord / Threads', name: 'ID 902 - เพิ่มผู้ติดตาม Threads บัญชีคุณภาพ', rate: 55.00, min: 50, max: 20000 }
        ];

        // ==========================================
        // 2. ตัวแปรเก็บสถานะปัจจุบัน (State)
        // ==========================================
        let currentPlatformId = 'all';
        let filteredServices = [...SERVICES_DATA];
        let selectedService = SERVICES_DATA[0];

        // อ้างอิง DOM Elements
        const platformTabsEl = document.getElementById('platformTabs');
        const searchInputEl = document.getElementById('searchInput');
        const clearSearchBtnEl = document.getElementById('clearSearchBtn');
        const categorySelectEl = document.getElementById('categorySelect');
        const serviceSelectEl = document.getElementById('serviceSelect');
        const linkInputEl = document.getElementById('linkInput');
        const platformLinkHintEl = document.getElementById('platformLinkHint');
        const quantityInputEl = document.getElementById('quantityInput');
        const totalPriceDisplayEl = document.getElementById('totalPriceDisplay');
        const serviceRateTextEl = document.getElementById('serviceRateText');
        const serviceMinMaxTextEl = document.getElementById('serviceMinMaxText');

        // ==========================================
        // 3. ฟังก์ชันสร้างและจัดการแถบหัวเมนูแพลตฟอร์ม
        // ==========================================
        function renderPlatformTabs() {
            platformTabsEl.innerHTML = '';
            PLATFORMS.forEach(platform => {
                const isActive = platform.id === currentPlatformId;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.dataset.id = platform.id;
                
                // สไตล์ปุ่มแท็บ: Active เป็นพื้นขาวมีเงาเหมือนปุ่ม "เปิดใช้งานบัญชีใหม่" ในภาพตัวอย่าง
                btn.className = isActive
                    ? 'flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-white text-gray-900 font-semibold text-xs shadow-sm whitespace-nowrap transition-all duration-200 shrink-0'
                    : 'flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl text-gray-500 hover:text-gray-800 font-medium text-xs whitespace-nowrap transition-all duration-200 shrink-0';

                btn.innerHTML = `
                    <i class="${platform.icon} ${isActive ? platform.color : 'text-gray-400'} text-sm"></i>
                    <span>${platform.name}</span>
                `;

                btn.addEventListener('click', () => {
                    selectPlatform(platform.id, btn);
                });

                platformTabsEl.appendChild(btn);
            });
        }

        // เมื่อผู้ใช้กดเลือกหัวเมนูแพลตฟอร์ม
        function selectPlatform(platformId, btnElement) {
            currentPlatformId = platformId;
            renderPlatformTabs();

            // เลื่อนปุ่มที่เลือกให้อยู่กึ่งกลางแถบเมนูอัตโนมัติ (Smooth Scroll)
            setTimeout(() => {
                const activeBtn = platformTabsEl.querySelector(`button[data-id="${platformId}"]`);
                if (activeBtn) {
                    activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }, 10);

            updateCategoriesAndServices();
        }

        // ==========================================
        // 4. ระบบกรองหมวดหมู่ บริการ และการค้นหา
        // ==========================================
        function updateCategoriesAndServices() {
            const keyword = searchInputEl.value.trim().toLowerCase();

            // กรองบริการตามแพลตฟอร์มที่เลือก และคำค้นหา (ID หรือ คีย์เวิร์ด)
            filteredServices = SERVICES_DATA.filter(item => {
                const matchPlatform = (currentPlatformId === 'all') || (item.platform === currentPlatformId);
                const matchKeyword = !keyword || 
                    item.name.toLowerCase().includes(keyword) || 
                    item.category.toLowerCase().includes(keyword) ||
                    item.id.toString().includes(keyword);
                return matchPlatform && matchKeyword;
            });

            // ดึงรายการหมวดหมู่ที่ไม่ซ้ำกัน
            const categories = [...new Set(filteredServices.map(s => s.category))];

            categorySelectEl.innerHTML = '';
            if (categories.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = 'ไม่พบหมวดหมู่ที่ตรงกับการค้นหา';
                categorySelectEl.appendChild(opt);
                
                serviceSelectEl.innerHTML = '<option value="">ไม่พบบริการ</option>';
                updateServiceDetails(null);
                return;
            }

            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                categorySelectEl.appendChild(opt);
            });

            // อัปเดตรายการบริการของหมวดหมู่แรก
            populateServicesByCategory(categories[0]);
        }

        function populateServicesByCategory(selectedCategory) {
            const servicesInCat = filteredServices.filter(s => s.category === selectedCategory);
            serviceSelectEl.innerHTML = '';

            servicesInCat.forEach(srv => {
                const opt = document.createElement('option');
                opt.value = srv.id;
                opt.textContent = `${srv.name} — ฿${srv.rate.toFixed(2)}/1,000`;
                serviceSelectEl.appendChild(opt);
            });

            if (servicesInCat.length > 0) {
                updateServiceDetails(servicesInCat[0]);
            }
        }

        // ==========================================
        // 5. อัปเดตรายละเอียดบริการ ข้อความแจ้งแพลตฟอร์มใต้ช่องลิงก์ และคำนวณราคา
        // ==========================================
        function updateServiceDetails(service) {
            selectedService = service;

            if (!service) {
                serviceRateTextEl.textContent = 'เรท: ฿0.00 / 1,000';
                serviceMinMaxTextEl.textContent = 'ขั้นต่ำ: 0 - สูงสุด: 0';
                platformLinkHintEl.innerHTML = `<i class="fa-solid fa-circle-exclamation text-amber-500"></i><span class="text-amber-600">กรุณาเลือกบริการก่อนวางลิงก์</span>`;
                calculateTotal();
                return;
            }

            // อัปเดตเรทและขั้นต่ำ-สูงสุด
            serviceRateTextEl.textContent = `เรทราคา: ฿${service.rate.toFixed(2)} / 1,000`;
            serviceMinMaxTextEl.textContent = `ขั้นต่ำ: ${service.min.toLocaleString()} - สูงสุด: ${service.max.toLocaleString()}`;

            // ตั้งค่า min/max และ placeholder ของช่องจำนวน
            quantityInputEl.min = service.min;
            quantityInputEl.max = service.max;
            quantityInputEl.placeholder = `ขั้นต่ำ ${service.min.toLocaleString()}`;

            // อัปเดต Placeholder และข้อความใต้ช่องลิงก์ให้ตรงกับแพลตฟอร์มนั้นๆ เป๊ะๆ
            linkInputEl.placeholder = `วางลิงก์ ${service.platformLabel} ที่นี่...`;
            platformLinkHintEl.innerHTML = `
                <i class="fa-solid fa-link text-blue-600 shrink-0"></i>
                <span>ต้องเป็นลิงก์ของแพลตฟอร์ม: <strong class="underline">${service.platformLabel}</strong> (เช่น ${service.linkExample})</span>
            `;

            calculateTotal();
        }

        // คำนวณค่าบริการที่ต้องชำระแบบ Real-time
        function calculateTotal() {
            if (!selectedService) {
                totalPriceDisplayEl.textContent = '฿0.00';
                return;
            }
            const qty = parseFloat(quantityInputEl.value) || 0;
            const total = (qty / 1000) * selectedService.rate;
            totalPriceDisplayEl.textContent = `฿${total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        // ==========================================
        // 6. Event Listeners และการโต้ตอบต่างๆ
        // ==========================================
        categorySelectEl.addEventListener('change', (e) => {
            populateServicesByCategory(e.target.value);
        });

        serviceSelectEl.addEventListener('change', (e) => {
            const srvId = parseInt(e.target.value);
            const found = filteredServices.find(s => s.id === srvId);
            if (found) updateServiceDetails(found);
        });

        quantityInputEl.addEventListener('input', calculateTotal);

        searchInputEl.addEventListener('input', () => {
            if (searchInputEl.value.length > 0) {
                clearSearchBtnEl.classList.remove('hidden');
            } else {
                clearSearchBtnEl.classList.add('hidden');
            }
            updateCategoriesAndServices();
        });

        function clearSearch() {
            searchInputEl.value = '';
            clearSearchBtnEl.classList.add('hidden');
            updateCategoriesAndServices();
        }

        // ฟังก์ชันวางลิงก์จาก Clipboard (พร้อม Fallback)
        async function pasteLink() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    linkInputEl.value = text;
                    linkInputEl.focus();
                }
            } catch (err) {
                linkInputEl.focus();
                showToast('กรุณากดค้างในช่องกรอกลิงก์แล้วเลือก "วาง" (Paste)', 'info');
            }
        }

        // จัดการเมื่อกดยืนยันสั่งซื้อ
        function handleOrderSubmit(e) {
            e.preventDefault();
            if (!selectedService) {
                showToast('กรุณาเลือกบริการที่ต้องการสั่งซื้อ', 'error');
                return;
            }

            const qty = parseInt(quantityInputEl.value) || 0;
            if (qty < selectedService.min || qty > selectedService.max) {
                showToast(`กรุณาระบุจำนวนระหว่าง ${selectedService.min.toLocaleString()} ถึง ${selectedService.max.toLocaleString()}`, 'error');
                return;
            }

            const total = ((qty / 1000) * selectedService.rate).toFixed(2);
            showToast(
                `สั่งซื้อ "${selectedService.name}" จำนวน ${qty.toLocaleString()} เรียบร้อยแล้ว ยอดชำระ ฿${total}`,
                'success',
                'ส่งคำสั่งซื้อสำเร็จ!'
            );
        }

        // ระบบ Modal แจ้งเตือนแทน alert()
        function showToast(message, type = 'success', title = 'แจ้งเตือนระบบ') {
            const modal = document.getElementById('toastModal');
            const iconEl = document.getElementById('toastIcon');
            const titleEl = document.getElementById('toastTitle');
            const msgEl = document.getElementById('toastMessage');

            titleEl.textContent = title;
            msgEl.textContent = message;

            if (type === 'error') {
                iconEl.className = 'w-14 h-14 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4 text-2xl';
                iconEl.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            } else if (type === 'info') {
                iconEl.className = 'w-14 h-14 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mx-auto mb-4 text-2xl';
                iconEl.innerHTML = '<i class="fa-solid fa-info"></i>';
            } else {
                iconEl.className = 'w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4 text-2xl';
                iconEl.innerHTML = '<i class="fa-solid fa-check"></i>';
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeToast() {
            const modal = document.getElementById('toastModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // เริ่มต้นทำงานเมื่อโหลดหน้าเว็บ
        window.addEventListener('DOMContentLoaded', () => {
            renderPlatformTabs();
            updateCategoriesAndServices();
        });
    </script>
</body>
</html>
