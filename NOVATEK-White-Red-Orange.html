const PAGES={"store":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"th\"\u003e\n\u003chead\u003e\n  \u003cmeta charset=\"UTF-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n  \u003cmeta name=\"theme-color\" content=\"#fff8f3\"\u003e\n  \u003ctitle\u003eNOVATEK \u2014 Technology for Life\u003c/title\u003e\n  \u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n  \u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin\u003e\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800\u0026family=Prompt:wght@400;500;600;700\u0026display=swap\" rel=\"stylesheet\"\u003e\n  \u003cstyle\u003e\n    :root {\n      /* \u0e42\u0e17\u0e19\u0e2a\u0e35 \u0e19\u0e49\u0e33\u0e40\u0e07\u0e34\u0e19\u0e40\u0e17\u0e32 / \u0e40\u0e17\u0e32\u0e02\u0e32\u0e27\u0e1f\u0e49\u0e32 / \u0e02\u0e32\u0e27\u0e41\u0e14\u0e07 */\n      --bg-main: #0f172a;          /* \u0e19\u0e49\u0e33\u0e40\u0e07\u0e34\u0e19\u0e40\u0e17\u0e32\u0e40\u0e02\u0e49\u0e21 */\n      --bg-surface: #1e293b;       /* \u0e19\u0e49\u0e33\u0e40\u0e07\u0e34\u0e19\u0e40\u0e17\u0e32\u0e01\u0e25\u0e32\u0e07 */\n      --bg-surface-alt: #334155;   /* \u0e40\u0e17\u0e32\u0e2d\u0e21\u0e1f\u0e49\u0e32 */\n      --border-slate: #334155;     /* \u0e40\u0e2a\u0e49\u0e19\u0e02\u0e2d\u0e1a\u0e19\u0e49\u0e33\u0e40\u0e07\u0e34\u0e19\u0e40\u0e17\u0e32 */\n      --text-white: #f8fafc;       /* \u0e02\u0e32\u0e27\u0e2a\u0e27\u0e48\u0e32\u0e07 */\n      --text-grey-blue: #cbd5e1;   /* \u0e40\u0e17\u0e32\u0e02\u0e32\u0e27\u0e1f\u0e49\u0e32 */\n      --text-muted: #94a3b8;       /* \u0e40\u0e17\u0e32\u0e2d\u0e48\u0e2d\u0e19 */\n      --accent-blue: #3b82f6;      /* \u0e1f\u0e49\u0e32\u0e2a\u0e14\u0e43\u0e2a */\n      --accent-sky: #60a5fa;       /* \u0e1f\u0e49\u0e32\u0e2d\u0e48\u0e2d\u0e19 */\n      --accent-red: #ef4444;       /* \u0e41\u0e14\u0e07\u0e2a\u0e14 */\n      --accent-red-dark: #dc2626;  /* \u0e41\u0e14\u0e07\u0e40\u0e02\u0e49\u0e21 */\n    }\n\n    * { box-sizing: border-box; }\n    html { scroll-behavior: smooth; }\n    body {\n      margin: 0;\n      background: linear-gradient(180deg, #0f172a 0%, #162033 100%);\n      color: var(--text-white);\n      font-family: 'Inter', 'Prompt', Arial, sans-serif;\n      font-size: 14px;\n      overflow-x: hidden;\n      min-height: 100vh;\n    }\n\n    /* Header \u0026 Navigation Wrapper (\u0e42\u0e17\u0e19\u0e19\u0e49\u0e33\u0e40\u0e07\u0e34\u0e19\u0e40\u0e17\u0e32-\u0e02\u0e32\u0e27\u0e1f\u0e49\u0e32-\u0e02\u0e32\u0e27\u0e41\u0e14\u0e07) */\n    .site-header {\n      background: rgba(15, 23, 42, 0.94);\n      backdrop-filter: blur(12px);\n      border-bottom: 1px solid #283548;\n      position: sticky;\n      top: 0;\n      z-index: 35;\n    }\n\n    .topbar {\n      height: 58px;\n      max-width: 1440px;\n      margin: auto;\n      padding: 0 4.5%;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      position: relative;\n      z-index: 15;\n    }\n    .head-left {\n      display: flex;\n      align-items: center;\n      gap: 12px;\n    }\n    .brand {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      text-decoration: none;\n      color: #ffffff;\n      font-size: 12px;\n      font-weight: 800;\n      letter-spacing: 3.5px;\n    }\n    .brand-mark {\n      font-size: 22px;\n      font-weight: 800;\n      letter-spacing: -4px;\n      color: var(--accent-sky);\n      transform: skewY(-8deg);\n      margin-right: 5px;\n      text-shadow: 0 0 14px rgba(59, 130, 246, 0.5);\n    }\n\n    /* PC Top Wallet Quick Bar (\u0e41\u0e2a\u0e14\u0e07\u0e02\u0e49\u0e32\u0e07\u0e40\u0e21\u0e19\u0e39\u0e1a\u0e19 PC) */\n    .pc-wallet-bar {\n      display: none;\n      align-items: center;\n      gap: 8px;\n      background: #1e293b;\n      border: 1px solid #334155;\n      border-radius: 30px;\n      padding: 4px 6px 4px 14px;\n    }\n    .pc-wallet-bal {\n      font-size: 12px;\n      color: var(--text-grey-blue);\n      display: flex;\n      align-items: center;\n      gap: 6px;\n    }\n    .pc-wallet-bal strong {\n      color: #60a5fa;\n      font-size: 13px;\n      font-weight: 700;\n    }\n    .pc-w-btn {\n      height: 28px;\n      padding: 0 12px;\n      border-radius: 20px;\n      border: 0;\n      font-family: inherit;\n      font-size: 11.5px;\n      font-weight: 600;\n      cursor: pointer;\n      display: inline-flex;\n      align-items: center;\n      gap: 5px;\n      transition: 0.2s;\n    }\n    .pc-w-btn.deposit {\n      background: #3b82f6;\n      color: #ffffff;\n    }\n    .pc-w-btn.deposit:hover { background: #2563eb; }\n    .pc-w-btn.withdraw {\n      background: #ffffff;\n      color: #dc2626;\n    }\n    .pc-w-btn.withdraw:hover { background: #fee2e2; }\n\n    /* PC Desktop Top Menu Bar (\u0e41\u0e16\u0e1a\u0e40\u0e21\u0e19\u0e39\u0e14\u0e49\u0e32\u0e19\u0e1a\u0e19\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a PC) */\n    .pc-navbar {\n      display: none;\n      background: linear-gradient(90deg, #1e293b 0%, #263349 50%, #1e293b 100%);\n      border-top: 1px solid #334155;\n    }\n    .pc-navbar-inner {\n      max-width: 1440px;\n      margin: auto;\n      padding: 0 4.5%;\n      display: flex;\n      align-items: center;\n      flex-wrap: wrap;\n      gap: 2px;\n    }\n    .pc-nav-item {\n      position: relative;\n    }\n    .pc-nav-link {\n      background: transparent;\n      border: 0;\n      color: #e2e8f0;\n      font-family: inherit;\n      font-size: 12px;\n      font-weight: 500;\n      padding: 10px 11px;\n      display: inline-flex;\n      align-items: center;\n      gap: 5px;\n      cursor: pointer;\n      white-space: nowrap;\n      border-bottom: 2px solid transparent;\n      transition: all 0.18s ease;\n    }\n    .pc-nav-link:hover,\n    .pc-nav-item:hover \u003e .pc-nav-link {\n      color: #ffffff;\n      background: rgba(59, 130, 246, 0.14);\n      border-bottom-color: #60a5fa;\n    }\n    .pc-nav-link.logout-link {\n      color: #fca5a5;\n    }\n    .pc-nav-link.logout-link:hover {\n      background: rgba(239, 68, 68, 0.16);\n      border-bottom-color: #ef4444;\n      color: #ffffff;\n    }\n    .pc-nav-link svg.caret {\n      width: 12px;\n      height: 12px;\n      stroke: #94a3b8;\n      fill: none;\n      stroke-width: 2;\n      transition: transform 0.2s;\n    }\n    .pc-nav-item:hover \u003e .pc-nav-link svg.caret {\n      transform: rotate(180deg);\n      stroke: #60a5fa;\n    }\n\n    /* PC Dropdown \u0026 Multi-Level Nested Submenu */\n    .pc-dropdown {\n      position: absolute;\n      top: 100%;\n      left: 0;\n      min-width: 235px;\n      background: #1e293b;\n      border: 1px solid #3b4b64;\n      border-radius: 12px;\n      padding: 6px;\n      box-shadow: 0 18px 40px rgba(2, 6, 23, 0.72);\n      opacity: 0;\n      visibility: hidden;\n      transform: translateY(8px);\n      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);\n      z-index: 50;\n    }\n    .pc-nav-item:hover \u003e .pc-dropdown,\n    .pc-nav-item.open \u003e .pc-dropdown {\n      opacity: 1;\n      visibility: visible;\n      transform: translateY(0);\n    }\n    .pc-nav-item.align-right \u003e .pc-dropdown {\n      left: auto;\n      right: 0;\n    }\n    .pc-drop-btn {\n      width: 100%;\n      background: transparent;\n      border: 0;\n      color: #e2e8f0;\n      font-family: inherit;\n      font-size: 12px;\n      padding: 8px 11px;\n      border-radius: 8px;\n      text-align: left;\n      cursor: pointer;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 8px;\n      transition: background 0.15s, color 0.15s;\n    }\n    .pc-drop-btn:hover {\n      background: #334155;\n      color: #ffffff;\n    }\n    .pc-sub-group {\n      position: relative;\n    }\n    .pc-sub-dropdown {\n      position: absolute;\n      top: -4px;\n      left: calc(100% + 4px);\n      min-width: 225px;\n      background: #1e293b;\n      border: 1px solid #3b4b64;\n      border-radius: 12px;\n      padding: 6px;\n      box-shadow: 0 18px 40px rgba(2, 6, 23, 0.75);\n      opacity: 0;\n      visibility: hidden;\n      transform: translateX(6px);\n      transition: all 0.2s ease;\n      z-index: 55;\n    }\n    .pc-nav-item.align-right .pc-sub-dropdown {\n      left: auto;\n      right: calc(100% + 4px);\n      transform: translateX(-6px);\n    }\n    .pc-sub-group:hover \u003e .pc-sub-dropdown {\n      opacity: 1;\n      visibility: visible;\n      transform: translateX(0);\n    }\n\n    @media (min-width: 992px) {\n      .menu-open { display: none !important; }\n      .pc-navbar { display: block; }\n      .pc-wallet-bar { display: flex; }\n    }\n\n    .head-actions {\n      display: flex;\n      align-items: center;\n      gap: 14px;\n    }\n\n    /* Expandable Left-Sliding Search Bar */\n    .search-bar-wrap {\n      display: flex;\n      align-items: center;\n      position: relative;\n    }\n    .inline-search-box {\n      display: flex;\n      align-items: center;\n      width: 0;\n      opacity: 0;\n      overflow: hidden;\n      background: #1e293b;\n      border: 1px solid transparent;\n      border-radius: 20px;\n      height: 32px;\n      margin-right: 0;\n      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease, margin-right 0.3s ease, border-color 0.25s ease;\n    }\n    .search-bar-wrap.active .inline-search-box {\n      width: min(240px, 42vw);\n      opacity: 1;\n      margin-right: 6px;\n      border-color: #475569;\n      padding: 0 8px 0 12px;\n      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);\n    }\n    .inline-search-box input {\n      width: 100%;\n      background: transparent;\n      border: 0;\n      color: #f8fafc;\n      font-family: inherit;\n      font-size: 16px;\n      transform: scale(0.8);\n      transform-origin: left center;\n      outline: none;\n    }\n    .inline-search-box input::placeholder {\n      color: #94a3b8;\n    }\n    .inline-search-clear {\n      background: none;\n      border: 0;\n      color: #94a3b8;\n      font-size: 15px;\n      cursor: pointer;\n      padding: 0 2px;\n      line-height: 1;\n    }\n    .inline-search-clear:hover { color: #fff; }\n    .search-dropdown {\n      position: absolute;\n      top: 42px;\n      right: 0;\n      width: min(310px, 82vw);\n      background: #1e293b;\n      border: 1px solid #334155;\n      border-radius: 14px;\n      padding: 8px;\n      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75);\n      display: none;\n      flex-direction: column;\n      gap: 6px;\n      z-index: 45;\n    }\n    .search-dropdown.show { display: flex; }\n    .search-result-item {\n      display: flex;\n      align-items: center;\n      gap: 10px;\n      padding: 8px;\n      border-radius: 10px;\n      cursor: pointer;\n      transition: background 0.18s;\n    }\n    .search-result-item:hover { background: #334155; }\n    .search-result-item img {\n      width: 36px;\n      height: 36px;\n      object-fit: contain;\n      background: #0f172a;\n      border-radius: 8px;\n      padding: 3px;\n    }\n    .search-result-meta { flex: 1; min-width: 0; }\n    .search-result-meta strong { display: block; font-size: 12px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n    .search-result-meta span { font-size: 11px; color: #60a5fa; font-weight: 600; }\n\n    .icon-btn {\n      position: relative;\n      background: none;\n      border: 0;\n      padding: 0;\n      color: #f8fafc;\n      cursor: pointer;\n      width: 22px;\n      height: 22px;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      transition: transform 0.2s, color 0.2s;\n    }\n    .icon-btn:hover { color: #60a5fa; transform: scale(1.06); }\n    .icon-btn svg {\n      width: 17px;\n      height: 17px;\n      fill: none;\n      stroke: currentColor;\n      stroke-width: 1.7;\n      stroke-linecap: round;\n      stroke-linejoin: round;\n    }\n    .cart-count {\n      position: absolute;\n      right: -7px;\n      top: -6px;\n      background: #ef4444;\n      color: #fff;\n      font-size: 8.5px;\n      font-style: normal;\n      border-radius: 20px;\n      min-width: 15px;\n      height: 15px;\n      display: grid;\n      place-items: center;\n      font-weight: 700;\n      border: 1px solid #ffffff;\n    }\n\n    /* Mobile Left Side Drawer (\u0e42\u0e17\u0e19\u0e19\u0e49\u0e33\u0e40\u0e07\u0e34\u0e19\u0e40\u0e17\u0e32-\u0e02\u0e32\u0e27\u0e1f\u0e49\u0e32-\u0e02\u0e32\u0e27\u0e41\u0e14\u0e07) */\n    .menu-backdrop {\n      position: fixed;\n      inset: 0;\n      background: rgba(15, 23, 42, 0.72);\n      backdrop-filter: blur(4px);\n      opacity: 0;\n      pointer-events: none;\n      transition: opacity 0.25s ease;\n      z-index: 40;\n    }\n    .menu-backdrop.open { opacity: 1; pointer-events: auto; }\n    .side-drawer {\n      position: fixed;\n      top: 0;\n      left: 0;\n      width: min(315px, 86vw);\n      height: 100dvh;\n      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);\n      border-right: 1px solid #334155;\n      padding: 16px 16px 20px;\n      display: flex;\n      flex-direction: column;\n      gap: 12px;\n      transform: translateX(-100%);\n      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);\n      z-index: 45;\n      box-shadow: 16px 0 40px rgba(0, 0, 0, 0.65);\n    }\n    .side-drawer.open { transform: translateX(0); }\n    .drawer-head {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      padding-bottom: 10px;\n      border-bottom: 1px solid #334155;\n    }\n    .drawer-title { font-size: 12px; font-weight: 800; letter-spacing: 3px; color: #f8fafc; }\n    .drawer-close {\n      background: #334155;\n      border: 1px solid #475569;\n      color: #ffffff;\n      width: 28px;\n      height: 28px;\n      border-radius: 50%;\n      display: grid;\n      place-items: center;\n      cursor: pointer;\n      font-size: 16px;\n      display: none;\n      flex-direction: column;\n      align-items: center;\n      border: 1.5px solid #e2e8f0;\n      border-radius: 12px;\n      padding: 20px 16px;\n      background: #f8fafc;\n      margin-bottom: 14px;\n    }\n    .gw-spinner {\n      width: 30px;\n      height: 30px;\n      border: 3px solid #e2e8f0;\n      border-top-color: #1e3a8a;\n      border-radius: 50%;\n      animation: gwSpin 0.8s linear infinite;\n      margin-bottom: 10px;\n    }\n    @keyframes gwSpin { to { transform: rotate(360deg); } }\n    .gw-warning { color: #dc2626; font-size: 12.5px; font-weight: 700; margin: 4px 0 16px; }\n    .gw-hr { border: 0; border-top: 1px solid #e6e6e6; margin: 0 0 16px; width: 100%; }\n    .gw-instructions {\n      margin: 0;\n      padding-left: 20px;\n      text-align: left;\n      font-size: 12px;\n      line-height: 1.65;\n      color: #555555;\n    }\n    .gw-instructions li { margin-bottom: 8px; }\n    .gw-success-view {\n      display: none;\n      flex-direction: column;\n      align-items: center;\n      justify-content: center;\n      padding: 40px 16px 24px;\n      text-align: center;\n    }\n    .gw-success-circle {\n      width: 72px;\n      height: 72px;\n      border-radius: 50%;\n      background: #eff6ff;\n      border: 2px solid #93c5fd;\n      color: #2563eb;\n      display: grid;\n      place-items: center;\n      margin-bottom: 18px;\n    }\n\n    @media(min-width:1100px) {\n      .hero { height: 400px; }\n      .hero-slide { padding-top: 58px; }\n      .hero-product { height: 370px; }\n      .benefits { margin-bottom: 36px; }\n      .category-card { height: 150px; }\n      .category-card img { height: 104px; }\n      .product-card { height: 235px; }\n    }\n    @media(max-width:768px) {\n      .topbar { height: 46px; padding: 0 4%; }\n      .head-left { gap: 8px; }\n      .brand { font-size: 10px; letter-spacing: 2.2px; gap: 4px; }\n      .brand-mark { font-size: 17px; letter-spacing: -3px; margin-right: 2px; }\n      .head-actions { gap: 10px; }\n      .icon-btn, .icon-btn svg { width: 15px; height: 15px; }\n      .cart-count { right: -5px; top: -4px; font-size: 7px; min-width: 12px; height: 12px; }\n      .inline-search-box { height: 26px; }\n      .search-bar-wrap.active .inline-search-box { width: min(175px, 40vw); }\n\n      .hero { height: 225px; }\n      .hero-slide { padding: 22px 4% 0; }\n      .eyebrow { font-size: 6.5px; letter-spacing: 1.8px; margin-bottom: 6px; }\n      .hero h1 { font-size: 26px; line-height: 1.06; letter-spacing: -1px; margin-bottom: 6px; }\n      .hero-desc { font-size: 8.5px; line-height: 1.45; margin-bottom: 12px; max-width: 92%; }\n      .hero-buttons { gap: 12px; }\n      .btn-primary { height: 25px; padding: 0 11px; gap: 8px; font-size: 7.5px; }\n      .btn-primary span { font-size: 12px; }\n      .text-link { font-size: 7.5px; }\n      .text-link span { font-size: 12px; margin-left: 4px; }\n      .hero-dots { bottom: 10px; gap: 5px; }\n      .hero-dot { width: 6px; height: 6px; }\n      .hero-dot.active { width: 16px; }\n      .hero-arrows { bottom: 8px; gap: 5px; }\n      .hero-arrow { width: 22px; height: 22px; }\n      .hero-arrow svg { width: 11px; height: 11px; }\n\n      .benefits { width: 92%; min-height: 54px; margin: -1px auto 18px; padding: 8px 0; border-radius: 8px; }\n      .benefit { gap: 1px; padding: 0 2px; }\n      .line-icon { height: 16px; }\n      .line-icon svg { width: 14px; height: 14px; }\n      .benefit strong { font-size: 7.5px; text-align: center; }\n      .benefit small { font-size: 6px; text-align: center; line-height: 1.2; }\n\n      .section { width: 92%; margin-bottom: 18px; }\n      .section-heading { margin-bottom: 8px; }\n      .section-heading h2 { font-size: 10.5px; }\n      .section-heading a { font-size: 7.5px; }\n      .section-heading a span { font-size: 11px; margin-left: 4px; }\n\n      .category-grid { gap: 5px; padding-bottom: 2px; }\n      .category-card { flex: 0 0 calc((100% - 25px) / 6); height: 78px; padding: 5px 2px 6px; border-radius: 6px; }\n      .category-card img { height: 46px; }\n      .category-card span { font-size: 6.8px; }\n\n      .product-grid { gap: 6px; padding-bottom: 2px; }\n      .product-card { flex: 0 0 calc((100% - 18px) / 4); height: 126px; padding: 6px; border-radius: 7px; }\n      .product-card \u003e img { inset: 6px 4px 32px; width: calc(100% - 8px); height: calc(100% - 38px); }\n      .badge { top: 6px; left: 6px; padding: 1.5px 5px; font-size: 5.5px; }\n      .product-info h3 { font-size: 7.2px; margin-bottom: 2px; padding-right: 17px; }\n      .product-info p { font-size: 7px; }\n      .product-info del { margin-left: 3px; font-size: 6px; }\n      .add-cart { right: 5px; bottom: 5px; width: 16px; height: 16px; }\n      .add-cart svg { width: 8.5px; height: 8.5px; }\n\n      .care-banner { width: 92%; min-height: 122px; padding: 14px 4%; margin-bottom: 12px; border-radius: 8px; }\n      .care-copy { max-width: 54%; }\n      .care-copy .eyebrow { margin-bottom: 5px; }\n      .care-copy h2 { font-size: 13px; line-height: 1.18; margin-bottom: 5px; }\n      .care-copy \u003e p:not(.eyebrow) { font-size: 6.8px; line-height: 1.4; margin-bottom: 8px; }\n      .care-copy .btn-primary { height: 20px; padding: 0 10px; font-size: 7px; gap: 8px; }\n      .care-art { right: 4%; width: 48%; }\n      .care-art img { width: 76%; height: 88%; }\n      .shield { width: 64px; height: 74px; }\n      .shield svg { width: 30px; height: 30px; }\n\n      .perks { width: 92%; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-bottom: 22px; }\n      .perk { min-height: 54px; padding: 9px 10px; gap: 8px; border-radius: 9px; }\n      .perk-icon { min-width: 18px; }\n      .perk-icon svg { width: 17px; height: 17px; }\n      .perk strong { font-size: 9px; margin-bottom: 2px; line-height: 1.2; }\n      .perk small { font-size: 7.5px; line-height: 1.25; }\n    }\n  \u003c/style\u003e\n\u003cstyle id=\"novatek-white-red-orange-store\"\u003e\n/* NOVATEK White / Red / Orange theme\n   Additive visual overrides only; original markup, data and behavior are intact. */\n:root {\n  --bg-main:#fffaf6; --bg-surface:#ffffff; --bg-surface-alt:#fff1e8;\n  --border-slate:#f2d4c6; --text-white:#262024; --text-grey-blue:#665d61;\n  --text-muted:#8d7f80; --accent-blue:#f04b2f; --accent-sky:#fa862b;\n  --accent-red:#ed2939; --accent-red-dark:#c91f31;\n  --th-red:#ed2939; --th-orange:#fa782a; --th-ink:#2a2022; --th-border:#f2d8cc;\n}\nhtml{background:#fffaf6!important}\nbody{background:linear-gradient(180deg,#fff 0%,#fff8f3 46%,#ffefe5 100%)!important;color:var(--th-ink)!important}\n/* Header / navigation / search */\n.site-header{background:rgba(255,255,255,.96)!important;border-bottom:1px solid #f3cfc0!important;box-shadow:0 3px 20px rgba(222,57,34,.09)}\n.brand,.icon-btn,.pc-nav-link,.pc-drop-btn{color:#322127!important}\n.brand-mark{color:var(--th-red)!important;text-shadow:0 3px 12px rgba(237,41,57,.18)!important}\n.pc-navbar{background:linear-gradient(90deg,#fff0e8,#fff,#fff0e8)!important;border-top:1px solid #f7e0d5!important}\n.pc-nav-link:hover,.pc-nav-item:hover\u003e.pc-nav-link{color:#d72b30!important;background:#ffede3!important;border-bottom-color:#ef6a30!important}\n.pc-nav-link.logout-link{color:#d02b37!important}\n.pc-nav-link.logout-link:hover{background:#ffe5e0!important;color:#b71b29!important}\n.pc-nav-link svg.caret{stroke:#ae6c62!important}.pc-nav-item:hover\u003e.pc-nav-link svg.caret{stroke:#e95128!important}\n.pc-dropdown,.pc-sub-dropdown,.search-dropdown{background:#fff!important;border-color:var(--th-border)!important;box-shadow:0 18px 36px rgba(114,33,22,.16)!important}\n.pc-drop-btn:hover,.search-result-item:hover{background:#fff1e9!important;color:#c93030!important}\n.pc-wallet-bar{background:#fff5ed!important;border-color:#f6cfbd!important}\n.pc-wallet-bal,.pc-wallet-bal strong{color:#d33430!important}\n.pc-w-btn.deposit,.btn-deposit{background:linear-gradient(120deg,#ec2937,#ff7928)!important;color:white!important}\n.pc-w-btn.deposit:hover{background:#db2836!important}\n.pc-w-btn.withdraw,.btn-withdraw{background:white!important;color:#d72e32!important;border:1px solid #f7b9a8!important}\n.inline-search-box{background:#fff7f0!important;border-color:#f2d2c6!important}\n.inline-search-box input,.search-result-meta strong{color:#342329!important}\n.inline-search-box input::placeholder{color:#9a8b8b!important}\n.search-result-meta span,.inline-search-clear,.icon-btn:hover{color:#e74730!important}\n.search-result-item img{background:#fff2e9!important}\n.menu-backdrop,.cart-backdrop,.modal-overlay,.pd-sheet-overlay,.bottom-sheet-overlay{background:rgba(63,29,30,.52)!important}\n/* Mobile drawer */\n.side-drawer,.cart-drawer{background:linear-gradient(180deg,#fff 0%,#fff7f0 100%)!important;border-color:#f1d3c7!important;box-shadow:12px 0 40px rgba(77,25,25,.2)!important}\n.drawer-head{border-color:#f1d3c7!important}\n.drawer-title,.cart-drawer-title{color:#d92d31!important}\n.drawer-close,.modal-close{background:#fff0e7!important;color:#b92a30!important;border-color:#f7cdc0!important}\n.wallet-card{background:linear-gradient(125deg,#e82039 0%,#f65c2d 54%,#ff9539 100%)!important;border-color:#f48e66!important;box-shadow:0 9px 24px rgba(228,54,49,.19)!important}\n.wallet-balance-row span,.wallet-balance-row strong{color:#fff!important}\n.drawer-item,.drawer-subitem,.drawer-nested-toggle{color:#352528!important}\n.drawer-item:hover,.drawer-group.open\u003e.drawer-item,.drawer-subitem:hover,.drawer-nested-toggle:hover{background:#ffebe2!important;color:#b62630!important}\n.drawer-item svg,.drawer-chevron,.drawer-subitem::before,.drawer-item:hover svg{stroke:#ed5830!important}\n.drawer-subitem::before{background:#ef582a!important}\n.drawer-logout{color:#dc2a39!important}\n.drawer-list::-webkit-scrollbar-thumb{background:#eea389!important}\n/* Hero stays rich and high contrast, now red-orange instead of blue */\n.hero-slide{background:radial-gradient(ellipse at 72% 52%,#ff8645 0%,#ee4b40 37%,#b61831 100%)!important}\n.hero-slide::after{background:linear-gradient(90deg,rgba(107,9,31,.96) 0%,rgba(170,23,43,.87) 43%,rgba(233,80,48,.18) 100%)!important}\n.hero h1,.hero-desc,.text-link{color:#fff!important}\n.eyebrow,.care-copy .eyebrow{color:#ffcf9b!important}\n.btn-primary,.btn-primary:hover{background:linear-gradient(110deg,#f32e37,#ff8c24)!important;color:#fff!important;box-shadow:0 6px 20px rgba(210,42,31,.32)!important}\n.text-link:hover{color:#ffd8b0!important}\n.hero-arrow{background:rgba(148,23,38,.7)!important;color:white!important;border-color:rgba(255,206,184,.5)!important}\n.hero-arrow:hover{background:#ec3c35!important}\n.hero-dot.active{background:#ffbe85!important;box-shadow:0 0 12px rgba(255,180,121,.55)!important}\n/* Main shopping blocks */\n.benefits,.perk,.category-card,.catalog-cat-card,.product-card,.cart-item,.product-spec-list{background:#fff!important;color:#2f2527!important;border-color:#f2dcd2!important;box-shadow:0 5px 20px rgba(152,62,42,.06)!important}\n.section-heading h2,.benefit strong,.perk strong,.product-info h3,.product-info b,.service-group-title,.spec-item strong{color:#2f2527!important}\n.section-heading a,.line-icon,.perk-icon,.search-result-meta span,.spec-item strong,.cart-item-info span{color:#e94a32!important}\n.benefit small,.perk small,.product-info p,.product-info del,.service-group-title small,.spec-item{color:#817477!important}\n.category-card:hover,.product-card:hover{border-color:#f28a60!important;box-shadow:0 10px 30px rgba(229,71,42,.13)!important}\n.catalog-cat-card{color:#533b39!important}\n.catalog-cat-card.active{background:linear-gradient(135deg,#ec2f38,#fa7e2d)!important;color:white!important;border-color:#ee453b!important;box-shadow:0 7px 20px rgba(231,65,49,.18)!important}\n.catalog-cat-card.active *{color:white!important}\n.badge.orange{background:#ff812d!important}.badge.blue,.badge.green{background:#e53b38!important}\n.add-cart,.back-shop-btn,.coupon-apply-btn{backgro t}\n.pd-banner-header::after{background:linear-gradient(95deg,rgba(105,17,36,.87),rgba(195,35,48,.38),transparent)!important}\n.pd-breadcrumb,.pd-breadcrumb span.current{color:white!important}\n.pd-sheet-close{background:#fff3ee!important;color:#bb2131!important;border-color:#f1b9aa!important}\n.pd-cat-pill{background:#fff1e9!important;color:#d94431!important}\n.pd-thumb-card,.pd-price-card{background:linear-gradient(135deg,#fff,#fff0e7)!important;border-color:#f3d2c4!important}\n.pd-graphic-watermark,.pd-trust-check{color:#ed563c!important}\n.pd-trust-check{background:#ffefe7!important}\n.pd-sheet-footer{background:#fffaf6!important;border-color:#f1d8ce!important}\n/* Wallet/deposit/withdraw specific forms: maintain bank-brand surfaces and icon graphics */\n.wd-top-blue,.gw-topbar{background:linear-gradient(110deg,#d72538 0%,#ef4f37 58%,#ff922d 100%)!important}\n.wd-submit-btn.ready,.black-action-btn{background:linear-gradient(110deg,#e72737,#ff7e2d)!important;color:#fff!important}\n.wd-submit-btn:not(.ready){background:#d4a99d!important}\n.wd-amount-box{border-color:#ffb99d!important}\n.phone-input-card:focus-within{border-color:#ef6d3d!important}\n.dp-cat-tab.active{color:#d33035!important}.dp-cat-tab.active::after{background:#f47432!important}\n.dp-amt-btn.selected{border-color:#ed4738!important;color:#d93436!important}\n.gw-qr-center,.gw-spinner{background:#f06339!important}\n.gw-spinner{border-top-color:#e93238!important}\n.gw-upload-box:hover{border-color:#eb6438!important;background:#fff3ed!important}\n.gw-success-circle{background:#fff0e7!important;color:#e33937!important}\n/* Accents for inline dynamic controls without altering JS */\na:not(.brand):not(.text-link){accent-color:#e93639}\ninput:focus,textarea:focus,select:focus{accent-color:#e83b36}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003c!-- Header: PC \u0e41\u0e16\u0e1a\u0e40\u0e21\u0e19\u0e39\u0e14\u0e49\u0e32\u0e19\u0e1a\u0e19 + \u0e1b\u0e38\u0e48\u0e21\u0e1d\u0e32\u0e01\u0e40\u ory = function(catId) {\n      activeCatalogCategory = catId;\n      renderCatalogPage();\n    };\n\n    function renderCatalogPage() {\n      const stripEl = document.getElementById('catalogCategoryStrip');\n      const containerEl = document.getElementById('catalogServicesContainer');\n      if (!stripEl || !containerEl) return;\n\n      stripEl.innerHTML = CATALOG_CATEGORIES.map(cat =\u003e `\n        \u003cbutton type=\"button\" class=\"catalog-cat-card ${activeCatalogCategory === cat.id ? 'active' : ''}\" onclick=\"filterCatalogCategory('${cat.id}')\"\u003e\n          \u003cimg src=\"${cat.img}\" alt=\"${cat.label}\"\u003e\n          \u003cspan\u003e${cat.label}\u003c/span\u003e\n        \u003c/button\u003e\n      `).join('');\n\n      const servicesToShow = activeCatalogCategory === 'ALL'\n        ? ['\u0e2a\u0e34\u0e19\u0e04\u0e49\u0e32\u0e2d\u0e2d\u0e19\u0e44\u0e25\u0e19\u0e4c', '\u0e40\u0e15\u0e34\u0e21\u0e40\u0e01\u0e21\u0e2a\u0e4c', '\u0e1a\u0e31\u0e15\u0e23\u0e40\u0e15\u0e34\u0e21\u0e40\u0e07\u0e34\u0e19', '\u0e41\u0e2d\u0e1e\u0e1e\u0e23\u0e35\u0e40\u0e21\u0e35\u0e48\u0e22\u0e21', '\u0e41\u0e1e\u0e47\u0e01\u0e40\u0e01\u0e08\u0e40\u0e2a\u0e23\u0e34\u0e21']\n        : [activeCatalogCategory];\n\n      containerEl.innerHTML = servicesToShow.map(serviceName =\u003e {\n        const items = CATALOG_PRODUCTS.filter(p =\u003e p.service === serviceName);\n        if (!items.length) return '';\n        return `\n          \u003cdiv class=\"service-group-block\"\u003e\n            \u003ch3 class=\"service-group-title\"\u003e\n              \u003cspan\u003e${serviceName}\u003c/span\u003e\n              \u003csmall\u003e${items.length} \u0e23\u0e32\u0e22\u0e01\u0e32\u0e23\u003c/small\u003e\n            \u003c/h3\u003e\n            \u003cdiv class=\"catalog-items-grid\"\u003e\n              ${items.map(item =\u003e `\n                \u003carticle class=\"product-card\" onclick=\"openProductDetail('${item.name}', ${item.price}, '${item.img}', '${item.desc}')\"\u003e\ e?\u003c/span\u003e\u003c/h4\u003e\n            \u003cdiv\u003e1.\u0e27\u0e07\u0e40\u0e07\u0e34\u0e19\u0e01\u0e32\u0e23\u0e16\u0e2d\u0e19\u0e15\u0e48\u0e2d\u0e27\u0e31\u0e19: \u003cspan class=\"red-num\"\u003e10,000.00\u003c/span\u003e\u003c/div\u003e\n            \u003cdiv\u003e2.Up to \u003cb\u003e2\u003c/b\u003e withdrawals per day, funds will be credited within approximately \u003cb\u003e1-10 minutes\u003c/b\u003e\u003c/div\u003e\n            \u003cdiv\u003e3.\u0e40\u0e27\u0e25\u0e32\u0e17\u0e33\u0e01\u0e32\u0e23\u0e16\u0e2d\u0e19\u0e40\u0e07\u0e34\u0e19: \u003cb\u003e\u0e27\u0e31\u0e19\u0e08\u0e31\u0e19\u0e17\u0e23\u0e4c\u0e16\u0e36\u0e07\u0e27\u0e31\u0e19\u0e40\u0e2a\u0e32\u0e23\u0e4c 10:00 - 19:00\u003c/b\u003e\u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"wd-footer\"\u003e\n          \u003cbutton type=\"button\" id=\"wdConfirmBtn\" class=\"wd-submit-btn ${(isWalletTab ? savedWalletPhone.length \u003e= 9 : !!savedBankAccount) ? 'ready' : ''}\" onclick=\"submitWithdrawAction()\"\u003e\n            ${isWalletTab ? '\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19\u0e01\u0e32\u0e23\u0e16\u0e2d\u0e19' : `\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19\u0e01\u0e32\u0e23\u0e16\u0e2d\u0e19\u0e40\u0e07\u0e34\u0e19 (${savedBankAccount ? '2/2' : '1/2'})`}\n          \u003c/button\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"sub-sheet-backdrop\" id=\"addBankSubSheet\"\u003e\n          \u003cdiv class=\"sub-sheet-box\"\u003e\n            \u003cdiv class=\"sub-sheet-head\"\u003e\n              \u003ch4\u003e\u0e40\u0e1e\u0e34\u0e48\u0e21\u0e1a\u0e31\u0e0d\u0e0a\u0e35\u003c/h4\u003e\n              \u003cbutton type=\"button\" class=\"sub-sheet-close\" onclick=\"closeAddBankSubSheet()\"\u003e\u00d7\u003c/button\u003e\n            \u003c/div\u003e\n\n            \u003clabel class=\"light-field-label\"\u003e\u003cspan\u003e*\u003c/span\u003e\u0e0a\u0e37\u0e48\u0e2d\u0e1a\u0e31\u0e0d\u0e0a\u0e35\u003c/label\u003e\n            \u003cdiv class=\"light-input-box\" style=\"color:#6b7280;\"\u003e\n              \u003cinput type=\"text\" id=\"newAccNameInput\" value=\"\u0e19\u0e23\u0e34\u0e19\u0e17\u0e23\u0e4c\u0e20\u0e31\u0e17\u0e23 \u0e21\u0e35\u0e0a\u0e31\u0e22\" readonly style=\"color:#6b7280;\"\u003e\n              \u003csvg viewBox=\"0 0 24 24\" style=\"width:16px;height:16px;fill:#6b7280;flex-shrink:0;\"\u003e\u003cpath d=\"M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z\"/\u003e\u003c/svg\u003e\n            \u003c/div\u003e\n\n            \u003clabel class=\"light-field-label\"\u003e\u003cspan\u003e*\u003c/span\u003eBank / E-Wallet\u003c/label\u003e\n            \u003cdiv class=\"light-input-box\" style=\"cursor:pointer;\" onclick=\"openBankPickerSubSheet()\"\u003e\n              \u003cdiv style=\"display:flex;align-items:center;gap:10px;\" id=\"selectedBankDisplay\"\u003e\n                ${renderBankBadge(THAI_BANKS.find(b =\u003e b.code === selectedBankCode) || THAI_BANKS[0])}\n                \u003cspan style=\"font-weight:600;\"\u003e${(THAI_BANKS.find(b =\u003e b.code === selectedBankCode) || THAI_BANKS[0]).name}\u003c/span\u003e\n              \u003c/div\u003e\n              \u003cspan style=\"font-size:18px;color:#6b7280;\"\u003e\u203a\u003c/span\u003e\n            \u003c/div\u003e\n\n            \u003clabel class=\"light-field-label\"\u003e\u003cspan\u003e*\u003c/span\u003e\u0e2b\u0e21\u0e32\u0e22\u0e40\u0e25\u0e02\u0e1a\u0e31\u0e0d\u0e0a\u0e35\u003c/label\u003e\n            \u003cdiv class=\"light-input-box\"\u003e\n              \u003cinput type=\"tel\" id=\"newAccNumberInput\" placeholder=\"\u0e01\u0e23\u0e38\u0e13\u0e32\u0e01\u0e23\u0e2d\u0e01\u0e2b\u0e21\u0e32\u0e22\u0e40\u0e25\u0e02\u0e1a\u0e31\u0e0d\u0e0a\u0e35\" maxlength=\"15\" value=\"${savedBankAccount ? savedBankAccount.accountNumber : ''}\"\u003e\n            \u003c/div\u003e\n\n            \u003cp style=\"text-align:center;font-size:11px;color:#9ca3af;margin:6px 0 16px;\"\u003e*\u0e1a\u0e31\u0e0d\u0e0a\u0e35\u0e08\u0e30\u0e16\u0e39\u0e01\u0e1c\u0e39\u0e01\u0e42\u0e14\u0e22\u0e2d\u0e31\u0e15\u0e42\u0e19\u0e21\u0e31\u0e15\u0e34\u0e2b\u0e25\u0e31\u0e07\u0e08\u0e32\u0e01\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19\u0e15\u0e31\u0e27\u0e15\u0e19\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08\u003c/p\u003e\n            \u003cbutton type=\"button\" class=\"black-action-btn\" onclick=\"saveNewBankAccount()\"\u003e\u0e2a\u0e48\u0e07\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u003c/button\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"sub-sheet-backdrop\" id=\"bankPickerSubSheet\"\u003e\n          \u003cdiv class=\"sub-sheet-box\"\u003e\n            \u003cdiv class=\"sub-sheet-head\"\u003e\n              \u003ch4\u003e\u0e40\u0e25\u0e37\u0e2d\u0e01\u0e18\u0e19\u0e32\u0e04\u0e32\u0e23/\u0e27\u0e2d\u0e25\u0e40\u0e25\u0e47\u0e15\u003c/h4\u003e\n              \u003cbutton type=\"button\" class=\"sub-sheet-close\" onclick=\"closeBankPickerSubSheet()\"\u003e\u00d7\u003c/button\u003e\n            \u003c/div\u003e\n            \u003cdiv id=\"bankPickerList\"\u003e\n              ${THAI_BANKS.map(b =\u003e `\n                \u003cdiv class=\"bank-select-row\" onclick=\"chooseBankOption('${b.code}')\"\u003e\n                  \u003cdiv class=\"bank-row-left\"\u003e\n                    ${renderBankBadge(b)}\n                    \u003cspan\u003e${b.name}\u003c/span\u003e\n                  \u003c/div\u003e\n                  \u003cdiv class=\"radio-circle ${selectedBankCode === b.code ? 'checked' : ''}\"\u003e\n                    ${selectedBankCode === b.code ? '\u2713' : ''}\n                  \u003c/div\u003e\n                \u003c/div\u003e\n              `).join('')}\n            \u003c/div\u003e\n            \u003cbutton type=\"button\" class=\"black-action-btn\" style=\"margin-top:10px;\" onclick=\"confirmBankPicker()\"\u003e\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19\u003c/button\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      `;\n    }\n\n    window.switchWdTab = function(mode) {\n      wdTabMode = mode;\n      renderWithdrawSheet();\n      if (wdTabMode === 'cash' \u0026\u0026 !savedBankAccount) {\n        setTimeout(() =\u003e openAddBankSubSheet(), 180);\n      }\n    };\n\n    window.onWalletPhoneInput = function(val) {\n      savedWalletPhone = val.replace(/\\D/g, '');\n      updateWdSubmitState();\n    };\n\n    window.openAddBankSubSheet = function() {\n      const sheet = document.getElementById('addBankSubSheet');\n      if (sheet) sheet.classList.add('open');\n    };\n\n    window.closeAddBankSubSheet = function() {\n      const sheet = document.getElementById('addBankSubSheet');\n      if (sheet) sheet.classList.remove('open');\n    };\n\n    window.openBankPickerSubSheet = function() {\n      const sheet = document.getElementById('bankPickerSubSheet');\n      if (sheet) sheet.classList.add('open');\n    };\n\n    window.closeBankPickerSubSheet = function() {\n      const sheet = document.getElementById('bankPickerSubSheet');\n      if (sheet) sheet.classList.remove('open');\n    };\n\n    window.chooseBankOption = function(code) {\n      selectedBankCode = code;\n      const listEl = document.getElementById('bankPickerList');\n      if (listEl) {\n        listEl.innerHTML = THAI_BANKS.map(b =\u003e `\n          \u003cdiv class=\"bank-select-row\" onclick=\"chooseBankOption('${b.code}')\"\u003e\n            \u003cdiv class=\"bank-row-left\"\u003e\n              ${renderBankBadge(b)}\n              \u003cspan\u003e${b.name}\u003c/span\u003e\n            \u003c/div\u003e\n            \u003cdiv class=\"radio-circle ${selectedBankCode === b.code ? 'checked' : ''}\"\u003e\n              ${selectedBankCode === b.code ? '\u2713' : ''}\n            \u003c/div\u003e\n          \u003c/div\u003e\n        `).join('');\n      }\n    };\n\n    window.confirmBankPicker = function() {\n      const bank = THAI_BANKS.find(b =\u003e b.code === selectedBankCode) || THAI_BANKS[0];\n      const displayEl = document.getElementById('selectedBankDisplay');\n      if (displayEl) {\n        displayEl.innerHTML = `${renderBankBadge(bank)}\u003cspan style=\"font-weight:600;\"\u003e${bank.name}\u003c/span\u003e`;\n      }\n      closeBankPickerSubSheet();\n    };\n\n    window.saveNewBankAccount = function() {\n      const accNumInput = document.getElementById('newAccNumberInput');\n      const accNameInput = document.getElementById('newAccNameInput');\n      const accNum = accNumInput ? accNumInput.value.replace(/\\D/g, '') : '';\n      if (accNum.length \u003c 8) {\n        return showToast('\u0e01\u0e23\u0e38\u0e13\u0e32\u0e01\u0e23\u0e2d\u0e01\u0e2b\u0e21\u0e32\u0e22\u0e40\u0e25\u0e02\u0e1a\u0e31\u0e0d\u0e0a\u0e35\u0e43\u0e2b\u0e49\u0e16\u0e39\u0e01\u0e15\u0e49\u0e2d\u0e07 (\u0e2d\u0e22\u0e48\u0e32\u0e07\u0e19\u0e49\u0e2d\u0e22 8 \u0e2b\u0e25\u0e31\u0e01)');\n      }\n      savedBankAccount = {\n        bankCode: selectedBankCode,\n        accountNumber: accNum,\n        accountName: accNameInput ? accNameInput.value : '\u0e19\u0e23\u0e34\u0e19\u0e17\u0e23\u0e4c\u0e20\u0e31\u0e17\u0e23 \u0e21\u0e35\u0e0a\u0e31\u0e22'\n      };\n      closeAddBankSubSheet();\n      renderWithdrawSheet();\n      showToast('\u0e40\u0e1e\u0e34\u0e48\u0e21\u0e1a\u0e31\u0e0d\u0e0a\u0e35\u0e18\u0e19\u0e32\u0e04\u0e32\u0e23\u0e40\u0e23\u0e35\u0e22\u0e1a\u0e23\u0e49\u0e2d\u0e22\u0e41\u0e25\u0e49\u0e27', '\u0e1c\u0e39\u0e01\u0e1a\u0e31\u0e0d\u0e0a\u0e35\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08');\n    };\n\n    window.updateWdSubmitState = function() {\n      const btn = document.getElementById('wdConfirmBtn');\n      const val = parseFloat(document.getElementById('wdAmountInput')?.value || 0);\n      if (!btn) return;\n      if (wdTabMode === 'wallet') {\n        if (savedWalletPhone.length \u003e= 9 \u0026\u0026 val \u003e 0) {\n          btn.classList.add('ready');\n        } else {\n          btn.classList.remove('ready');\n        }\n      } else if (savedBankAccount \u0026\u0026 val \u003e 0) {\n        btn.classList.add('ready');\n      }\n    };\n\n    window.submitWithdrawAction = function() {\n      const val = parseFloat(document.getElementById('wdAmountInput')?.value || 0);\n      if (wdTabMode === 'wallet') {\n        const phoneDigits = (document.getElementById('wdWalletPhoneInput')?.value || savedWalletPhone).replace(/\\D/g, '');\n        if (phoneDigits.length \u003c 9) {\n          return showToast('\u0e01\u0e23\u0e38\u0e13\u0e32\u0e01\u0e23\u0e2d\u0e01\u0e40\u0e1a\u0e2d\u0e23\u0e4c\u0e42\u0e17\u0e23\u0e28\u0e31\u0e1e\u0e17\u0e4c\u0e27\u0e2d\u0e25\u0e40\u0e25\u0e47\u0e15\u0e43\u0e2b\u0e49\u0e16\u0e39\u0e01\u0e15\u0e49\u0e2d\u0e07');\n        }\n        if (!val || val \u003c= 0) {\n          return showToast('\u0e01\u0e23\u0e38\u0e13\u0e32\u0e23\u0e30\u0e1a\u0e38\u0e08\u0e33\u0e19\u0e27\u0e19\u0e40\u0e07\u0e34\u0e19\u0e17\u0e35\u0e48\u0e15\u0e49\u0e2d\u0e07\u0e01\u0e32\u0e23\u0e16\u0e2d\u0e19');\n        }\n        if (val \u003e walletBalance) {\n          return showToast('\u0e22\u0e2d\u0e14\u0e40\u0e07\u0e34\u0e19\u0e04\u0e07\u0e40\u0e2b\u0e25\u0e37\u0e2d\u0e44\u0e21\u0e48\u0e40\u0e1e\u0e35\u0e22\u0e07\u0e1e\u0e2d');\n        }\n        savedWalletPhone = phoneDigits;\n        walletBalance -= val;\n        updateBalanceUI();\n        closeWalletSheet();\n        return showToast(`\u0e2a\u0e48\u0e07\u0e04\u0e33\u0e02\u0e2d\u0e16\u0e2d\u0e19\u0e40\u0e07\u0e34\u0e19\u0e27\u0e2d\u0e25\u0e40\u0e25\u0e47\u0e15 \u0e3f${val.toLocaleString('th-TH')} \u0e44\u0e1b\u0e22\u0e31\u0e07\u0e40\u0e1a\u0e2d\u0e23\u0e4c +66 ${phoneDigits} \u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08!`, '\u0e16\u0e2d\u0e19\u0e40\u0e07\u0e34\u0e19\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08');\n      }\n\n      if (!savedBankAccount) {\n        openAddBankSubSheet();\n        return showToast('\u0e01\u0e23\u0e38\u0e13\u0e32\u0e40\u0e1e\u0e34\u0e48\u0e21\u0e1a\u0e31\u0e0d\u0e0a\u0e35\u0e18\u0e19\u0e32\u0e04\u0e32\u0e23\u0e01\u0e48\u0e2d\u0e19\u0e17\u0e33\u0e01\u0e32\u0e23\u0e16\u0e2d\u0e19\u0e40\u0e07\u0e34\u0e19');\n      }\n      if (!val || val \u003c= 0) {\n        return showToast('\u0e01\u0e23\u0e38\u0e13\u0e32\u0e23\u0e30\u0e1a\u0e38\u0e08\u0e33\u0e19\u0e27\u0e19\u0e40\u0e07\u0e34\u0e19\u0e17\u0e35\u0e48\u0e15\u0e49\u0e2d\u0e07\u0e01\u0e32\u0e23\u0e16\u0e2d\u0e19');\n      }\n      if (val \u003e walletBalance) {\n        return showToast('\u0e22\u0e2d\u0e14\u0e40\u0e07\u0e34\u0e19\u0e04\u0e07\u0e40\u0e2b\u0e25\u0e37\u0e2d\u0e44\u0e21\u0e48\u0e40\u0e1e\u0e35\u0e22\u0e07\u0e1e\u0e2d');\n      }\n      walletBalance -= val;\n      updateBalanceUI();\n      closeWalletSheet();\n      showToast(`\u0e2a\u0e48\u0e07\u0e04\u0e33\u0e02\u0e2d\u0e16\u0e2d\u0e19\u0e40\u0e07\u0e34\u0e19 \u0e3f${val.toLocaleString('th-TH')} \u0e40\u0e02\u0e49\u0e32\u0e1a\u0e31\u0e0d\u0e0a\u0e35 ${savedBankAccount.accountNumber} \u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08!`, '\u0e16\u0e2d\u0e19\u0e40\u0e07\u0e34\u0e19\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08');\n    };\n\n    // --- Logout Confirmation Modal ---\n    function openLogoutModal() {\n      closeMenu();\n      openModal(\n        '\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19\u0e01\u0e32\u0e23\u0e2d\u0e2d\u0e01\u0e08\u0e32\u0e01\u0e23\u0e30\u0e1a\u0e1a',\n        '\u003csvg viewBox=\"0 0 24 24\"\u003e\u003cpath d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"/\u003e\u003cpolyline points=\"16 17 21 12 16 7\"/\u003e\u003cline x1=\"21\" y1=\"12\" x2=\"9\" y2=\"12\"/\u003e\u003c/svg\u003e',\n        `\n          \u003cp style=\"font-size:13px;color:#cbd5e1;line-height:1.6;margin:0 0 18px;\"\u003e\u0e04\u0e38\u0e13\u0e15\u0e49\u0e2d\u0e07\u0e01\u0e32\u0e23\u0e2d\u0e2d\u0e01\u0e08\u0e32\u0e01\u0e23\u0e30\u0e1a\u0e1a\u0e1a\u0e31\u0e0d\u0e0a\u0e35\u0e2a\u0e21\u0e32\u0e0a\u0e34\u0e01 NOVATEK \u0e43\u0e0a\u0e48\u0e2b\u0e23\u0e37\u0e2d\u0e44\u0e21\u0e48? \u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e15\u0e30\u0e01\u0e23\u0e49\u0e32\u0e2a\u0e34\u0e19\u0e04\u0e49\u0e32\u0e02\u0e2d\u0e07\u0e04\u0e38\u0e13\u0e08\u0e30\u0e16\u0e39\u0e01\u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01\u0e44\u0e27\u0e49\u0e0a\u0e31\u0e48\u0e27\u0e04\u0e23\u0e32\u0e27\u003c/p\u003e\n          \u003cdiv style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;\"\u003e\n            \u003cbutton type=\"button\" class=\"preset-btn\" style=\"height:42px;\" onclick=\"closeModal()\"\u003e\u0e22\u0e01\u0e40\u0e25\u0e34\u0e01\u003c/button\u003e\n            \u003cbutton type=\"button\" class=\"modal-submit danger\" style=\"height:42px;\" onclick=\"closeModal();showToast('\u0e2d\u0e2d\u0e01\u0e08\u0e32\u0e01\u0e23\u0e30\u0e1a\u0e1a\u0e40\u0e23\u0e35\u0e22\u0e1a\u0e23\u0e49\u0e2d\u0e22\u0e41\u0e25\u0e49\u0e27', '\u0e2d\u0e2d\u0e01\u0e08\u0e32\u0e01\u0e23\u0e30\u0e1a\u0e1a\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08')\"\u003e\u0e2d\u0e2d\u0e01\u0e08\u0e32\u0e01\u0e23\u0e30\u0e1a\u0e1a\u003c/button\u003e\n          \u003c/div\u003e\n        `\n      );\n    }\n\n    // --- Full-Height Shopping Cart Drawer ---\n    const cartDrawer = document.getElementById('cartDrawer');\n    const cartBackdrop = document.getElementById('cartBackdrop');\n\n    function openCartDrawer() {\n      closeMenu();\n      closeProductDrawer();\n      closeModal();\n      renderCartDrawer();\n      cartDrawer.classList.add('open');\n      cartBackdrop.classList.add('open');\n    }\n\n    function closeCartDrawer() {\n      cartDrawer.classList.remove('open');\n      cartBackdrop.classList.remove('open');\n    }\n\n    document.getElementById('cartCloseBtn').addEventListener('click', closeCartDrawer);\n    cartBackdrop.addEventListener('click', closeCartDrawer);\n\n    window.applyCouponCode = function() {\n      const input = document.getElementById('couponCodeInput');\n      if (!input) return;\n      const code = input.value.trim().toUpperCase();\n      if (!code) return showToast('\u0e01\u0e23\u0e38\u0e13\u0e32\u0e01\u0e23\u0e2d\u0e01\u0e23\u0e2b\u0e31\u0e2a\u0e2a\u0e48\u0e27\u0e19\u0e25\u0e14 (\u0e25\u0e2d\u0e07\u0e43\u0e0a\u0e49: NOVA10 \u0e2b\u0e23\u0e37\u0e2d SAVE50)');\n      if (AVAILABLE_COUPONS[code]) {\n        appliedCoupon = AVAILABLE_COUPONS[code];\n        renderCartDrawer();\n        showToast(`\u0e43\u0e0a\u0e49\u0e04\u0e39\u0e1b\u0e2d\u0e07 ${code} \u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08!`, '\u0e43\u0e0a\u0e49\u0e04\u0e39\u0e1b\u0e2d\u0e07\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08');\n      } else {\n        showToast('\u0e23\u0e2b\u0e31\u0e2a\u0e2a\u0e48\u0e27\u0e19\u0e25\u0e14\u0e44\u0e21\u0e48\u0e16\u0e39\u0e01\u0e15\u0e49\u0e2d\u0e07 (\u0e41\u0e19\u0e30\u0e19\u0e33: NOVA10, SAVE50)');\n      }\n    };\n\n    window.removeCouponCode = function() {\n      appliedCoupon = null;\n      renderCartDrawer();\n      showToast('\u0e22\u0e01\u0e40\u0e25\u0e34\u0e01\u0e01\u0e32\u0e23\u0e43\u0e0a\u0e49\u0e04\u0e39\u0e1b\u0e2d\u0e07\u0e41\u0e25\u0e49\u0e27');\n    };\n\n    function renderCartDrawer() {\n      const bodyEl = document.getElementById('cartDrawerBody');\n      const footerEl = document.getElementById('cartDrawerFooter');\n      const subtotal = cartItems.reduce((sum, item) =\u003e sum + (item.price * item.qty), 0);\n\n      if (!cartItems.length) {\n        appliedCoupon = null;\n        bodyEl.innerHTML = `\n          \u003cdiv style=\"margin:auto;text-align:center;padding:30px 16px;color:#94a3b8;\"\u003e\n            \u003csvg viewBox=\"0 0 24 24\" style=\"width:44px;height:44px;stroke:#475569;fill:none;stroke-width:1.5;margin-bottom:10px;\"\u003e\u003cpath d=\"M5 8h14l1 13H4L5 8Z\"/\u003e\u003cpath d=\"M9 9V6a3 3 0 0 1 6 0v3\"/\u003e\u003c/svg\u003e\n            \u003cdiv style=\"font-size:14px;color:#f8fafc;font-weight:600;margin-bottom:4px;\"\u003e\u0e15\u0e30\u0e01\u0e23\u0e49\u0e32\u0e2a\u0e34\u0e19\u0e04\u0e49\u0e32\u0e02\u0e2d\u0e07\u0e04\u0e38\u0e13\u0e22\u0e31\u0e07\u0e27\u0e48\u0e32\u0e07\u0e2d\u0e22\u0e39\u0e48\u003c/div\u003e\n            \u003cdiv style=\"font-size:12px;\"\u003e\u0e40\u0e25\u0e37\u0e2d\u0e01\u0e0a\u0e21\u0e2a\u0e34\u0e19\u0e04\u0e49\u0e32\u0e40\u0e17\u0e04\u0e42\u0e19\u0e42\u0e25\u0e22\u0e35\u0e2a\u0e38\u0e14\u0e25\u0e49\u0e33\u0e41\u0e25\u0e30\u0e40\u0e1e\u0e34\u0e48\u0e21\u0e25\u0e07\u0e15\u0e30\u0e01\u0e23\u0e49\u0e32\u0e44\u0e14\u0e49\u0e40\u0e25\u0e22\u003c/div\u003e\n          \u003c/div\u003e\n        `;\n        footerEl.innerHTML = `\u003cbutton type=\"button\" class=\"modal-submit\" onclick=\"closeCartDrawer()\"\u003e\u0e40\u0e25\u0e37\u0e2d\u0e01\u0e0a\u0e49\u0e2d\u0e1b\u0e2a\u0e34\u0e19\u0e04\u0e49\u0e32\u0e15\u0e48\u0e2d\u003c/button\u003e`;\n        return;\n      }\n\n      bodyEl.innerHTML = `\n        \u003cdiv style=\"font-size:11px;font-weight:600;color:#93c5fd;letter-spacing:0.5px;\"\u003e\u0e23\u0e32\u0e22\u0e01\u0e32\u0e23\u0e2a\u0e34\u0e19\u0e04\u0e49\u0e32\u0e17\u0e35\u0e48\u0e40\u0e1e\u0e34\u0e48\u0e21\u003c/div\u003e\n        ${cartItems.map((item, index) =\u003e `\n          \u003cdiv class=\"cart-item\"\u003e\n            \u003cimg src=\"${item.img}\" alt=\"${item.name}\"\u003e\n            \u003cdiv class=\"cart-item-info\"\u003e\n              \u003ch4\u003e${item.name}\u003c/h4\u003e\n              \u003cspan\u003e$${(item.price * item.qty).toLocaleString()}\u003c/span\u003e\n              \u003cdiv\u003e\n                \u003cdiv class=\"qty-controls\"\u003e\n                  \u003cbutton type=\"button\" class=\"qty-btn\" onclick=\"changeCartQty(${index}, -1)\" aria-label=\"\u0e25\u0e14\u0e08\u0e33\u0e19\u0e27\u0e19\"\u003e\u2212\u003c/button\u003e\n                  \u003cspan class=\"qty-val\"\u003e${item.qty}\u003c/span\u003e\n                  \u003cbutton type=\"button\" class=\"qty-btn\" onclick=\"changeCartQty(${index}, 1)\" aria-label=\"\u0e40\u0e1e\u0e34\u0e48\u0e21\u0e08\u0e33\u0e19\u0e27\u0e19\"\u003e+\u003c/button\u003e\n                \u003c/div\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n            \u003cbutton type=\"button\" class=\"cart-remove\" onclick=\"removeCartItem(${index})\" aria-label=\"\u0e25\u0e1a\u0e2a\u0e34\u0e19\u0e04\u0e49\u0e32\"\u003e\u00d7\u003c/button\u003e\n          \u003c/div\u003e\n        `).join('')}\n      `;\n\n      let discountAmount = 0;\n      if (appliedCoupon) {\n        if (appliedCoupon.type === 'percent') {\n          discountAmount = Math.min((subtotal * appliedCoupon.value) / 100, appliedCoupon.max);\n        } else if (appliedCoupon.type === 'fixed') {\n          discountAmount = Math.min(appliedCoupon.value, subtotal);\n        }\n      }\n\n      const afterDiscount = Math.max(0, subtotal - discountAmount);\n      const shippingFee = (appliedCoupon?.type === 'shipping' || afterDiscount \u003e= 500) ? 0 : 15;\n      const vatAmount = afterDiscount * 0.07;\n      const netTotal = afterDiscount + shippingFee + vatAmount;\n\n      footerEl.innerHTML = `\n        \u003cdiv class=\"coupon-box\"\u003e\n          \u003cinput type=\"text\" id=\"couponCodeInput\" placeholder=\"\u0e01\u0e23\u0e2d\u0e01\u0e23\u0e2b\u0e31\u0e2a\u0e2a\u0e48\u0e27\u0e19\u0e25\u0e14 (\u0e40\u0e0a\u0e48\u0e19 NOVA10, SAVE50)\" value=\"${appliedCoupon ? appliedCoupon.code : ''}\"\u003e\n          \u003cbutton type=\"button\" class=\"coupon-apply-btn\" onclick=\"applyCouponCode()\"\u003e\u0e43\u0e0a\u0e49\u0e42\u0e04\u0e49\u0e14\u003c/button\u003e\n        \u003c/div\u003e\n        ${appliedCoupon ? `\n          \u003cdiv class=\"applied-coupon-tag\"\u003e\n            \u003cspan\u003e\u0e04\u0e39\u0e1b\u0e2d\u0e07\u0e17\u0e35\u0e48\u0e43\u0e0a\u0e49: \u003cstrong\u003e${appliedCoupon.code}\u003c/strong\u003e (${appliedCoupon.label})\u003c/span\u003e\n            \u003cbutton type=\"button\" onclick=\"removeCouponCode()\" aria-label=\"\u0e25\u0e1a\u0e04\u0e39\u0e1b\u0e2d\u0e07\"\u003e\u00d7\u003c/button\u003e\n          \u003c/div\u003e\n        ` : ''}\n        \u003cdiv class=\"breakdown-list\"\u003e\n          \u003cdiv class=\"breakdown-row\"\u003e\n            \u003cspan\u003e\u0e22\u0e2d\u0e14\u0e23\u0e27\u0e21\u0e2a\u0e34\u0e19\u0e04\u0e49\u0e32\u003c/span\u003e\n            \u003cspan\u003e$${subtotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}\u003c/span\u003e\n          \u003c/div\u003e\n          ${discountAmount \u003e 0 ? `\n          \u003cdiv class=\"breakdown-row discount\"\u003e\n            \u003cspan\u003e\u0e2a\u0e48\u0e27\u0e19\u0e25\u0e14\u0e04\u0e39\u0e1b\u0e2d\u0e07 (${appliedCoupon.code})\u003c/span\u003e\n            \u003cspan\u003e-$${discountAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}\u003c/span\u003e\n          \u003c/div\u003e\n          ` : ''}\n          \u003cdiv class=\"breakdown-row\"\u003e\n            \u003cspan\u003e\u0e04\u0e48\u0e32\u0e08\u0e31\u0e14\u0e2a\u0e48\u0e07\u003c/span\u003e\n            \u003cspan\u003e${shippingFee === 0 ? '\u003cspan style=\"color:#60a5fa;\"\u003e\u0e1f\u0e23\u0e35\u003c/span\u003e' : `$${shippingFee.toFixed(2)}`}\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"breakdown-row\"\u003e\n            \u003cspan\u003e\u0e20\u0e32\u0e29\u0e35\u0e21\u0e39\u0e25\u0e04\u0e48\u0e32\u0e40\u0e1e\u0e34\u0e48\u0e21 (VAT 7%)\u003c/span\u003e\n            \u003cspan\u003e$${vatAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"breakdown-row net-total\"\u003e\n            \u003cspan\u003e\u0e22\u0e2d\u0e14\u0e2a\u0e38\u0e17\u0e18\u0e34\u003c/span\u003e\n            \u003cspan\u003e$${netTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}\u003c/span\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n        \u003cbutton type=\"button\" class=\"modal-submit\" onclick=\"checkoutCart(${netTotal.toFixed(2)})\"\u003e\u0e14\u0e33\u0e40\u0e19\u0e34\u0e19\u0e01\u0e32\u0e23\u0e0a\u0e33\u0e23\u0e30\u0e40\u0e07\u0e34\u0e19\u003c/button\u003e\n      `;\n    }\n\n    window.changeCartQty = function(index, delta) {\n      if (!cartItems[index]) return;\n      cartItems[index].qty += delta;\n      if (cartItems[index].qty \u003c= 0) {\n        cartItems.splice(index, 1);\n      }\n      updateCartUI();\n    };\n\n    window.removeCartItem = function(index) {\n      cartItems.splice(index, 1);\n      updateCartUI();\n      showToast('\u0e25\u0e1a\u0e2a\u0e34\u0e19\u0e04\u0e49\u0e32\u0e2d\u0e2d\u0e01\u0e08\u0e32\u0e01\u0e15\u0e30\u0e01\u0e23\u0e49\u0e32\u0e41\u0e25\u0e49\u0e27');\n    };\n\n    window.checkoutCart = function(netTotal) {\n      if (!cartItems.length) return;\n      openCheckoutChannelSheet(Number(netTotal));\n    };\n\n    // --- Bottom-Sliding Product Detail Sheet ---\n    const productDrawer = document.getElementById('productDrawer');\n    const productBackdrop = document.getElementById('productBackdrop');\n    const productSheetOverlay = document.getElementById('productSheetOverlay');\n    const productSheetPanel = document.getElementById('productSheetPanel');\n    let currentDetailQty = 1;\n\n    function closeProductSheet() {\n      if (productSheetOverlay) productSheetOverlay.classList.remove('open');\n    }\n\n    function closeProductDrawer() {\n      if (productDrawer) productDrawer.classList.remove('open');\n      if (productBackdrop) productBackdrop.classList.remove('open');\n      closeProductSheet();\n    }\n\n    if (document.getElementById('productCloseBtn')) {\n      document.getElementById('productCloseBtn').addEventListener('click', closeProductDrawer);\n    }\n    if (productBackdrop) {\n      productBackdrop.addEventListener('click', closeProductDrawer);\n    }\n    if (productSheetOverlay) {\n      productSheetOverlay.addEventListener('click', e =\u003e {\n        if (e.target === productSheetOverlay) closeProductSheet();\n      });\n    }\n\n    window.switchProductTab = function(tabName, btnEl) {\n      if (!productSheetPanel) return;\n      productSheetPanel.querySelectorAll('.p-tab-btn').forEach(b =\u003e b.classList.remove('active'));\n      productSheetPanel.querySelectorAll('.p-tab-panel').forEach(p =\u003e p.classList.remove('active'));\n      if (btnEl) btnEl.classList.add('active');\n      const targetPanel = productSheetPanel.querySelector(`#tab-${tabName}`);\n      if (targetPanel) targetPanel.classList.add('active');\n    };\n\n    window.changeDetailQty = function(delta) {\n      currentDetailQty = Math.max(1, currentDetailQty + delta);\n      const valEl = document.getElementById('detailQtyVal');\n      if (valEl) valEl.textContent = currentDetailQty;\n    };\n\n    window.openProductDetail = function(name, price, img, desc) {\n      closeMenu();\n      closeCartDrawer();\n      closeModal();\n      currentDetailQty = 1;\n\n      const matched = CATALOG_PRODUCTS.find(p =\u003e p.name === name);\n      const serviceCategory = matched ? matched.service : '\u0e2a\u0e34\u0e19\u0e04\u0e49\u0e32\u0e2d\u0e2d\u0e19\u0e44\u0e25\u0e19\u0e4c';\n      const watermarkText = name.split(' ')[0].toUpperCase();\n\n      productSheetPanel.innerHTML = `\n        \u003cdiv class=\"pd-banner-header\"\u003e\n          \u003cimg src=\"${img}\" alt=\"${name}\" class=\"pd-banner-bg\"\u003e\n          \u003cdiv class=\"pd-graphic-overlay\" aria-hidden=\"true\"\u003e\n            \u003cspan class=\"pd-graphic-watermark\"\u003e${watermarkText}\u003c/span\u003e\n          \u003c/div\u003e\n\n          \u003cdiv class=\"pd-banner-top\"\u003e\n            \u003cdiv class=\"pd-breadcrumb\"\u003e\n              \u003cspan\u003e\u0e23\u0e32\u0e22\u0e01\u0e32\u0e23\u0e2a\u0e34\u0e19\u0e04\u0e49\u0e32\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14\u003c/span\u003e\n              \u003cspan\u003e/\u003c/span\u003e\n              \u003cspan class=\"current\"\u003e${name}\u003c/span\u003e\n            \u003c/div\u003e\n            \u003cbutton type=\"button\" class=\"pd-sheet-close\" onclick=\"closeProductSheet()\" aria-label=\"\u0e1b\u0e34\u0e14\u0e23\u0e32\u0e22\u0e25\u0e30\u0e40\u0e2d\u0e35\u0e22\u0e14\u0e2a\u0e34\u0e19\u0e04\u0e49\u0e32\"\u003e\u00d7\u003c/button\u003e\n          \u003c/div\u003e\n\n          \u003cdiv class=\"pd-banner-main\"\u003e\n            \u003cspan class=\"pd-cat-pill\"\u003e${serviceCategory}\u003c/span\u003e\n            \u003cdiv class=\"pd-identity-row\"\u003e\n              \u003cdiv class=\"pd-thumb-card\"\u003e\n                \u003cimg src=\"${img}\" alt=\"${name}\"\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"pd-identity-text\"\u003e\n                \u003ch2\u003e${name}\u003c/h2\u003e\n                \u003cp\u003e${desc}\u003c/p\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n\n          \u003cdiv class=\"pd-trust-badges\"\u003e\n            \u003cspan class=\"pd-trust-item\"\u003e\u003cspan class=\"pd-trust-check\"\u003e\u2713\u003c/span\u003e\u0e1b\u0e25\u0e2d\u0e14\u0e20\u0e31\u0e22 100%\u003c/span\u003e\n            \u003cspan class=\"pd-trust-item\"\u003e\u003cspan class=\"pd-trust-check\"\u003e\u2713\u003c/span\u003e\u0e2a\u0e48\u0e07\u0e44\u0e27\u0e2d\u0e31\u0e15\u0e42\u0e19\u0e21\u0e31\u0e15\u0e34\u003c/span\u003e\n            \u003cspan class=\"pd-trust-item\"\u003e\u003cspan class=\"pd-trust-check\"\u003e\u2713\u003c/span\u003e\u0e23\u0e31\u0e1a\u0e1b\u0e23\u0e30\u0e01\u0e31\u0e19\u0e15\u0e25\u0e2d\u0e14\u0e01\u0e32\u0e23\u0e43\u0e0a\u0e49\u0e07\u0e32\u0e19\u003c/span\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"pd-sheet-body\"\u003e\n          \u003cdiv class=\"pd-price-card\"\u003e\n            \u003cdiv\u003e\n              \u003cdiv style=\"font-size:11px;color:#94a3b8;margin-bottom:2px;\"\u003e\u0e23\u0e32\u0e04\u0e32\u0e08\u0e33\u0e2b\u0e19\u0e48\u0e32\u0e22\u003c/div\u003e\n              \u003cdiv style=\"font-size:24px;font-weight:800;color:#60a5fa;\"\u003e$${price.toLocaleString()}\u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv style=\"text-align:right;\ const BRIDGE="/* Additive integration layer. Runs only in the storefront iframe; the original source remains unchanged. */\n(function(){\n  const FONTBANK_CDN='https://cdn.jsdelivr.net/gh/allaboutitappscript/fontbank/banks.min.css';\n  if(!document.querySelector('link[data-fontbank]')){\n    const link=document.createElement('link');link.rel='stylesheet';link.href=FONTBANK_CDN;link.dataset.fontbank='1';document.head.appendChild(link);\n  }\n  const style=document.createElement('style');style.textContent=`\n    .novatek-real-bank{display:inline-block!important;width:30px!important;height:30px!important;min-width:30px!important;min-height:30px!important;border-radius:7px!important;vertical-align:middle!important;flex-shrink:0!important;object-fit:contain}\n    .bank-card-brand .novatek-real-bank{width:28px!important;height:28px!important}\n    .gw-bank-title .novatek-real-bank{width:26px!important;height:26px!important;margin-right:9px;vertical-align:middle}\n    .novatek-tiny-bank{display:inline-block!important;width:20px!important;height:20px!important;margin-left:2px;vertical-align:middle;border-radius:50%}\n    .novatek-real-bank.bank{background-size:contain!important}\n  `;document.head.appendChild(style);\n  const lookup={KBANK:'kbank',BBL:'bbl',SCB:'scb',KTB:'ktb',TTB:'tmb',TMB:'tmb',BAY:'bay',GSB:'gsb',BAAC:'baac',PromptPay:'pp','K PLUS':'kbank','Siam Commercial Bank':'scb','Bangkok Bank':'bbl','Government Savings Bank':'gsb','Krung Thai Bank':'ktb','Bank of Ayudhya':'bay',TrueMoney:'tmn','TrueMoney Wallet':'tmn'};\n  const bankCode=(obj)=\u003elookup[obj.code]||lookup[obj.id]||lookup[obj.name]||(/PromptPay/i.test(obj.name||'')?'pp':null);\n  const previous=window.renderBankBadge;\n  window.renderBankBadge=function(bankObj){\n    const code=bankObj\u0026\u0026bankCode(bankObj);\n    if(!code)return previous(bankObj);\n    return `\u003ci class=\"bank bank-${code} xxxl round novatek-real-bank\" role=\"img\" title=\"${String(bankObj.name||bankObj.code||'').replace(/\"/g,'\u0026quot;')}\" aria-label=\"${String(bankObj.name||bankObj.code||'').replace(/\"/g,'\u0026quot;')}\"\u003e\u003c/i\u003e`;\n  };\n  function decorate(){\n    document.querySelectorAll('.gw-bank-title:not([data-bank-marked])').forEach(node=\u003e{\n      const text=node.textContent||'';\n      const names=[['\u0e01\u0e2a\u0e34\u0e01\u0e23|Kbank|K PLUS','kbank'],['\u0e44\u0e17\u0e22\u0e1e\u0e32\u0e13\u0e34\u0e0a\u0e22\u0e4c|SCB','scb'],['\u0e01\u0e23\u0e38\u0e07\u0e40\u0e17\u0e1e|BBL','bbl'],['\u0e01\u0e23\u0e38\u0e07\u0e44\u0e17\u0e22|Krung Thai|KTB','ktb'],['\u0e01\u0e23\u0e38\u0e07\u0e28\u0e23\u0e35|Ayudhya|BAY','bay'],['\u0e2d\u0e2d\u0e21\u0e2a\u0e34\u0e19|GSB','gsb'],['TrueMoney|\u0e17\u0e23\u0e39\u0e21\u0e31\u0e19\u0e19\u0e35\u0e48','tmn']];\n      const found=names.find(([rx])=\u003enew RegExp(rx,'i').test(text));\n      if(found){const ico=document.createElement('i');ico.className='bank bank-'+found[1]+' xxxl round novatek-real-bank';ico.setAttribute('aria-hidden','true');node.prepend(ico)}node.dataset.bankMarked='1';\n    });\n    document.querySelectorAll('.gw-brand:not([data-bank-marked])').forEach(el=\u003e{\n      if(el.textContent.includes('THAI QR PAYMENT')){\n        const ico=document.createElement('i');ico.className='bank bank-pp xxl round novatek-real-bank';ico.setAttribute('aria-label','PromptPay');el.prepend(ico)\n      }el.dataset.bankMarked='1';\n    });\n    document.querySelectorAll('.add-account-dashed:not([data-banks-marked])').forEach(el=\u003e{\n      const parts=el.querySelectorAll(':scope \u003e span');\n      if(parts[1])parts[1].innerHTML=['ktb','tmb','scb'].map(x=\u003e`\u003ci class=\"bank bank-${x} xl round novatek-tiny-bank\" aria-hidden=\"true\"\u003e\u003c/i\u003e`).join('');el.dataset.banksMarked='1';\n    });\n    const modal=document.getElementById('modalBody');\n    if(modal \u0026\u0026 modal.textContent.includes('\u0e2a\u0e21\u0e32\u0e0a\u0e34\u0e01 VIP NOVATEK') \u0026\u0026 !modal.querySelector('.unified-login-link')){\n      const button=document.createElement('button');button.className='modal-submit unified-login-link';button.type='button';button.style.cssText='margin-top:10px;background:#3b82f6';button.textContent='\u0e40\u0e02\u0e49\u0e32\u0e2a\u0e39\u0e48\u0e23\u0e30\u0e1a\u0e1a / \u0e40\u0e1b\u0e34\u0e14\u0e43\u0e0a\u0e49\u0e07\u0e32\u0e19\u0e1a\u0e31\u0e0d\u0e0a\u0e35\u0e43\u0e2b\u0e21\u0e48';button.addEventListener('click',()=\u003ewindow.parent.NOVATEK_UNIFIED?.show('member'));modal.appendChild(button);\n    }\n  }\n  let queued=false;\n  const obs=new MutationObserver(()=\u003e{if(!queued){queued=true;requestAnimationFrame(()=\u003e{queued=false;decorate()})}});\n  obs.observe(document.body,{childList:true,subtree:true});\n  document.addEventListener('click',(event)=\u003e{\n    if(event.target.closest('[data-menu-action=\"\u0e40\u0e1e\u0e34\u0e48\u0e21\u0e22\u0e2d\u0e14\u0e1f\u0e2d\u0e25\"]'))setTimeout(()=\u003ewindow.parent.NOVATEK_UNIFIED?.show('social'),0);\n    if(event.target.closest('.account-open'))setTimeout(decorate,0);\n  },true);\n  decorate();\n})();\n";
